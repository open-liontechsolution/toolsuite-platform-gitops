# QA test user for the helit QA provider (juanjocop/cocina-familiar#66).
#
# helit's release gate (`validar-qa`) refuses to promote anything to the family's pantry unless its
# report says APTO, and it cannot reach that verdict without this user. Without it the API front can
# only exercise the half that proves the app REJECTS anonymous requests — and the ADR has had the
# reason written down since 31/08/2026: *an app that answers 401 to everybody passes that whole class
# of tests in green*. Half a lock is not half a problem.
#
# ── WHY A NEW GROUP AND NOT `familia` ──
#
# 41-helit-qa-oidc.yaml binds the QA application to `familia`, but 40-cocina-oidc.yaml binds the
# PRODUCTION application (`cocina`) to that same group. Putting a test account in `familia` would hand
# it the real pantry — the one the family actually cooks from. So this user gets `qa-helit` and
# nothing else: no `familia`, and no `pc-*` either (those are what SSSD uses to allow desktop login on
# the Bazzite VM, and a test account has no business logging into anybody's computer).
#
# The QA application is `policy_engine_mode: any`, so the binding below sits alongside the `familia`
# one instead of replacing it: the family keeps its access to QA, and this account gains QA only.
#
# ── TWO SECRETS, AND THEY ARE NOT INTERCHANGEABLE ──
#
# This one account is used by two different fronts of the validation, and each needs its own secret.
# Neither can live in git; both are post-apply steps (see the README).
#
#   login password    the browser front (case U3) signs in through the Authentik form, exactly the
#                     way the family does. Set with `ak changepassword qa-helit`.
#   App Password      the API front (`qa-token.sh`, cases A19-A26) exchanges it at the token endpoint.
#                     Declared below; its key is generated by Authentik and read from the admin UI.
#
# **El grant `password` de Authentik NO acepta la contraseña de la persona**, y esto cuesta una tarde
# si se descubre sobre la marcha: `providers/oauth2/views/token.py` busca un Token con
# `intent=INTENT_APP_PASSWORD` cuya `key` sea lo que viaja en el campo `password`, y si no lo
# encuentra contesta `invalid_grant` — que se lee como «contraseña mala» y no lo es. Es el mismo
# mecanismo que 20-ldap.yaml usa para `ldap-service`.
version: 1
metadata:
  name: helit-qa-test-user
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "helit QA test user + QA-only access group (rev1)"
entries:
  # QA-only access group. Its whole job is to grant the helit QA application and nothing else, so
  # that a test account never overlaps with the groups that open the real pantry (`familia`) or a
  # desktop session (`pc-*`).
  - model: authentik_core.group
    identifiers:
      name: qa-helit
    attrs:
      is_superuser: false

  - model: authentik_core.user
    identifiers:
      username: qa-helit
    attrs:
      # `internal` and not `service_account` on purpose. Case U3 of the validation signs in through
      # the Authentik login form, and the value of that case is that it walks the same path the
      # family walks — a service account would exercise a different one.
      name: QA (helit)
      type: internal
      path: users
      is_active: true
      # helit reads `name` from the `profile` scope and shows it in the pantry's history ("QA (helit)
      # marked lentils as missing"), so QA reports say who touched what without looking like a person.
      groups:
        - !Find [authentik_core.group, [name, qa-helit]]

  # Second binding on the QA application, order 1, next to the `familia` one from 41-helit-qa-oidc.yaml.
  # `__check_policy_access` in the token view runs this engine for the password grant too, so without
  # it the token endpoint answers `invalid_grant` even with a correct App Password.
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, helit-qa]]
      group: !Find [authentik_core.group, [name, qa-helit]]
      order: 1
    attrs:
      enabled: true

  # The App Password the API front exchanges for an access token. Declared here so the object itself
  # is in git and nobody has to remember it exists; the KEY is generated by Authentik and never
  # appears in this repo — it is read once from the admin UI and written into a gitignored file in
  # the helit checkout (`.claude/qa-test-user.local`, as QA_APP_PASSWORD).
  #
  # `expiring: false` is load-bearing: an expiring token defaults to 30 minutes, and the failure
  # would show up weeks later as a QA validation that suddenly cannot authenticate.
  - model: authentik_core.token
    identifiers:
      identifier: qa-helit-app-password
    attrs:
      user: !Find [authentik_core.user, [username, qa-helit]]
      intent: app_password
      expiring: false
      description: helit QA — access token for validar-qa (cocina-familiar#66)
