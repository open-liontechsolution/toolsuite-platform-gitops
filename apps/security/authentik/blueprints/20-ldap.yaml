# LDAP provider + application + outpost + SSSD service account (Fase 2).
# - base_dn / UID-GID start ≥ 5000 (avoid collision with Bazzite locals at 1000+)
# - LDAPS cert = keypair "casa-ldap" (discovered from /certs/casa-ldap, signed by
#   casa-internal-ca), pushed to the outpost by the core for LDAPS :636.
# - The outpost is "external" (no service_connection): its Deployment/Service are
#   deployed by this chart (templates/ldap-outpost.yaml).
# Post-apply manual steps (secrets): seal the outpost token, and create + retrieve
# an app-password token for ldap-service for SSSD's ldap_default_authtok. The
# service account also needs the "Search full LDAP directory" permission (RBAC).
version: 1
metadata:
  name: casa-ldap
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "casa LDAP provider + outpost (rev7: search perm for ldap-service)"
entries:
  - model: authentik_core.user
    identifiers:
      username: ldap-service
    attrs:
      name: LDAP Service Account (SSSD)
      type: service_account
      path: users

  - id: ldap-provider
    model: authentik_providers_ldap.ldapprovider
    identifiers:
      name: LDAP - casa
    attrs:
      # NOTE: the blueprint/API serializer uses authorization_flow + invalidation_flow
      # (the Terraform provider's bind_flow/unbind_flow names do NOT work here).
      authorization_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      base_dn: dc=ldap,dc=casa,dc=lan
      certificate: !Find [authentik_crypto.certificatekeypair, [name, casa-ldap]]
      tls_server_name: ldap.casa.lan
      uid_start_number: 5000
      gid_start_number: 5000
      # Must be true so the outpost accepts the ldap-service app-password token for
      # bind (Authentik only validates app passwords when mfa_support is on). This
      # does NOT force MFA: users without an MFA device bind with just their
      # password; users who HAVE MFA append their TOTP. Standard Authentik+SSSD pattern.
      mfa_support: true
    # Grant the SSSD service account the object permission to search the whole
    # directory (otherwise it can only see itself). Done here (GitOps) instead of
    # the UI. Codename on the ldapprovider model = search_full_directory.
    permissions:
      - permission: search_full_directory
        user: !Find [authentik_core.user, [username, ldap-service]]

  - model: authentik_core.application
    identifiers:
      slug: ldap-casa
    attrs:
      name: LDAP (casa)
      # Reference the provider via !Find (DB lookup) instead of !KeyOf: more
      # robust than same-run instance binding, which failed with
      # "KeyOf: failed to find entry with id of ldap-provider".
      provider: !Find [authentik_providers_ldap.ldapprovider, [name, "LDAP - casa"]]

  - model: authentik_outposts.outpost
    identifiers:
      name: LDAP outpost (casa)
    attrs:
      type: ldap
      providers:
        - !Find [authentik_providers_ldap.ldapprovider, [name, "LDAP - casa"]]
      # config is required by the serializer. External outpost (we deploy it),
      # so kubernetes_* settings are irrelevant; the pod gets the host/token via env.
      config:
        log_level: info
        authentik_host: "https://authentik-casa-server.security-casa.svc.cluster.local"
        authentik_host_insecure: true
        object_naming_template: "ak-outpost-%(name)s"
