apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-local-casa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tools

  source:
    repoURL: https://github.com/open-liontechsolution/toolsuite-platform-gitops
    path: apps/security/authentik
    targetRevision: main
    helm:
      releaseName: authentik-casa
      valueFiles:
        - values.yaml
        - environments/local/casa.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: security-casa

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    # Authentik manages its own outpost Deployments/replicas at runtime.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
