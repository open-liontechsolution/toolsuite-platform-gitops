{{- if .Values.ldapOutpost.enabled }}
{{- $o := .Values.ldapOutpost }}
# Token for the outpost to authenticate back to the Authentik core API.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $o.token.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-ldap-outpost
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  encryptedData:
    AUTHENTIK_TOKEN: {{ $o.token.encryptedData.AUTHENTIK_TOKEN | quote }}
  template:
    metadata:
      name: {{ $o.token.secretName }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-ldap-outpost
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-ldap-outpost
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-ldap-outpost
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-ldap-outpost
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with $o.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ldap
          image: {{ $o.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTHENTIK_HOST
              value: {{ $o.authentikHost | quote }}
            - name: AUTHENTIK_INSECURE
              value: {{ $o.authentikInsecure | quote }}
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $o.token.secretName }}
                  key: AUTHENTIK_TOKEN
          ports:
            - name: ldap
              containerPort: 3389
            - name: ldaps
              containerPort: 6636
          resources:
            {{- toYaml $o.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-ldap-outpost
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-ldap-outpost
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with $o.serviceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: LoadBalancer
  {{- with $o.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    app.kubernetes.io/name: authentik-ldap-outpost
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: ldap
      port: 389
      targetPort: ldap
    - name: ldaps
      port: 636
      targetPort: ldaps
{{- end }}
