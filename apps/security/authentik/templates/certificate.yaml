{{- range .Values.certificates }}
# Certificate signed by the internal CA. Authentik mounts the resulting secret
# under /certs and discovers it as a keypair (referenced by a blueprint).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  secretName: {{ .secretName }}
  privateKey:
    algorithm: ECDSA
    size: 256
  {{- with .dnsNames }}
  dnsNames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .ipAddresses }}
  ipAddresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  issuerRef:
    name: {{ $.Values.certificateIssuer }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
