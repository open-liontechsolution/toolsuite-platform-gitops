# Authentik - Home / Family environment ("casa")
# Namespace: security-casa (coexists with keycloak, fully independent)
# Deployment: local k3s cluster (arm64 workers) with Longhorn storage
# Note: "casa" is the home-use environment axis (not dev/qa/prod) - this is the
# family IdP running on-prem, not an externally-facing project environment.

redis:
  enabled: true
  persistence:
    enabled: true
    storageClass: longhorn
    size: 1Gi
  nodeSelector:
    node-role.kubernetes.io/worker: "true"

# NetworkPolicy: allow egress to the Authentik CNPG cluster in data-casa.
networkPolicy:
  enabled: true
  databaseNamespace: "data-casa"

# Internal-CA certs: UI (casa-internal) + LDAPS (casa-ldap). Folder name under
# /certs becomes the discovered keypair name referenced by the blueprints.
certificateIssuer: casa-internal-ca
certificates:
  - secretName: authentik-server-tls
    dnsNames:
      - authentik.casa.lan
    ipAddresses:
      - 192.169.2.40
  - secretName: authentik-ldap-tls
    dnsNames:
      - ldap.casa.lan
    ipAddresses:
      - 192.169.2.41

# LDAP outpost: deployed by this chart (manual/external outpost), exposed via
# Cilium BGP LoadBalancer on a pinned IP. Seal the token after first sync.
ldapOutpost:
  enabled: true
  authentikHost: "http://authentik-casa-server.security-casa.svc.cluster.local"
  authentikInsecure: "true"
  loadBalancerIP: 192.169.2.41
  serviceLabels:
    bgp: blue
  nodeSelector:
    node-role.kubernetes.io/worker: "true"
  token:
    secretName: authentik-ldap-outpost-token
    encryptedData:
      AUTHENTIK_TOKEN: ""  # REPLACE: seal the outpost token (see README)

authentik:
  global:
    # Mount the UI + LDAP certs so Authentik discovers them as keypairs
    # "casa-internal" / "casa-ldap" (folder names), referenced by the blueprints.
    volumes:
      - name: ui-cert
        secret:
          secretName: authentik-server-tls
          items:
            - key: tls.crt
              path: fullchain.pem
            - key: tls.key
              path: privkey.pem
      - name: ldap-cert
        secret:
          secretName: authentik-ldap-tls
          items:
            - key: tls.crt
              path: fullchain.pem
            - key: tls.key
              path: privkey.pem
    volumeMounts:
      - name: ui-cert
        mountPath: /certs/casa-internal
        readOnly: true
      - name: ldap-cert
        mountPath: /certs/casa-ldap
        readOnly: true

  authentik:
    log_level: info
    postgresql:
      # CNPG read-write service for the dedicated Authentik cluster.
      host: "authentik-postgres-casa-rw.data-casa.svc.cluster.local"
      name: authentik
      user: authentik
      port: 5432

  blueprints:
    configMaps:
      - authentik-blueprints

  server:
    replicas: 1
    # Exposed directly via Cilium LB-IPAM/BGP (Cilium Ingress is not functional in
    # this cluster and Gateway API is not enabled). Authentik terminates TLS on
    # :9443 with the casa-internal-ca cert (mounted via global.volumes -> /certs,
    # discovered and assigned to the brand by blueprints/10-brand-web-cert.yaml).
    # 80 -> 9000 (http, redirects), 443 -> 9443 (https).
    service:
      type: LoadBalancer
      loadBalancerIP: 192.169.2.40
      # Required: the Cilium blue-pool only selects services labelled bgp=blue.
      labels:
        bgp: blue
    ingress:
      enabled: false
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    nodeSelector:
      node-role.kubernetes.io/worker: "true"

  worker:
    replicas: 1
    # The worker is RAM-hungry; keep it on a worker node.
    resources:
      requests:
        cpu: "200m"
        memory: "768Mi"
      limits:
        cpu: "1"
        memory: "1536Mi"
    nodeSelector:
      node-role.kubernetes.io/worker: "true"

# SealedSecret with Authentik runtime secrets for security-casa.
# IMPORTANT: replace the placeholders before syncing. Encrypt each value with:
#   echo -n "<value>" | kubeseal --raw --from-file=/dev/stdin --namespace security-casa --name authentik-secret --controller-name sealed-secrets --controller-namespace kube-system
# AUTHENTIK_POSTGRESQL__PASSWORD must equal the DB password sealed into
# data-casa/authentik-postgres-app (apps/data/authentik-postgres).
sealedSecret:
  enabled: true
  name: authentik-secret
  encryptedData:
    AUTHENTIK_SECRET_KEY: ""           # REPLACE: `openssl rand -base64 60` then seal
    AUTHENTIK_POSTGRESQL__PASSWORD: "" # REPLACE: same plaintext as the CNPG app secret
    AUTHENTIK_BOOTSTRAP_PASSWORD: ""   # REPLACE: initial akadmin password
    AUTHENTIK_BOOTSTRAP_TOKEN: ""      # REPLACE: initial API token
