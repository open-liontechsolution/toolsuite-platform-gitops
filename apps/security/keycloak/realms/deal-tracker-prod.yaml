# Realm deal-tracker-prod — produccion de deal-tracker (issue #50)
#
# Realm y client PROPIOS, no compartidos con dev ni con QA. Ese es el motivo de la
# issue: hoy QA se autentica contra el realm `deal-tracker-dev` con el mismo client,
# y en deal-tracker#219 un `webOrigins` mal puesto en ese client tumbo el login de QA
# entero. Compartiendo realm, ese mismo fallo se llevaria por delante produccion.
#
# La INSTANCIA si es compartida: esto vive en el mismo Keycloak que dev/QA, servido en
# keycloak-dev.liontechsolution.com. Los usuarios de produccion veran ese host en la
# barra al iniciar sesion. Decidido asi a proposito para no bloquear el estreno; el
# host esta dentro del KEYCLOAK_ISSUER_URL que valida el backend, asi que cambiarlo
# despues obliga a resellar el secret de `deal-tracker/overlays/prod`.
#
# Contrato con los otros dos repos (k3s-local-apps-manifests, deal-tracker):
#   KEYCLOAK_ISSUER_URL          = https://keycloak-dev.liontechsolution.com/realms/deal-tracker-prod
#   KEYCLOAK_AUDIENCE            = deal-tracker-web
#   KEYCLOAK_ADMIN_CLIENT_ID     = deal-tracker-api      (el alta por invitacion, issue #61)
#   KEYCLOAK_ADMIN_CLIENT_SECRET = el que genera Keycloak, sellado alli
# Estan escritos en deal-tracker/overlays/prod/secret.example.yaml. Si cambia el nombre
# del realm o del client aqui, alli deja de validar ningun token. Las dos ultimas son
# opcionales del lado de la aplicacion: sin ellas arranca igual y el registro responde 503.
#
# `webOrigins` espera ORIGENES DESNUDOS. Leer la cabecera de deal-tracker-dev.yaml antes
# de tocarlo; el template lo rechaza en tiempo de render.

realm: deal-tracker-prod
enabled: true
sslRequired: external

loginWithEmailAllowed: true
duplicateEmailsAllowed: false
editUsernameAllowed: false

# Alta manual, decidido para el estreno. Sin SMTP configurado en la instancia no hay
# verificacion de correo NI recuperacion de contrasena: con auto-registro, un usuario
# que olvide la suya se quedaria fuera para siempre. Cuando haya SMTP se cambia aqui,
# y la contrasena del servidor de correo entra por var-substitution desde un
# SealedSecret, nunca en claro en este fichero.
registrationAllowed: false
registrationEmailAsUsername: false
verifyEmail: false
resetPasswordAllowed: false

# A diferencia de dev: aqui las contrasenas son de personas reales y el login esta
# expuesto a internet por el tunnel.
bruteForceProtected: true

# Las PERSONAS no se declaran en este fichero: keycloak-config-cli no sabe borrarlas, y el
# CronJob de reconciliacion de las 04:00 volveria a habilitar cada noche a quien se hubiera
# dado de baja. Meter credenciales en git es ademas justo lo que la #49 pide evitar. El unico
# `users:` que hay —al final— es el service account de `deal-tracker-api` (issue #61): no es
# una persona, no tiene contrasena y se retira borrando su client, asi que no le aplica nada de
# esto. Ahi solo van service accounts; razonado en docs/KEYCLOAK_USERS.md. Alta de personas:
#
#   ./scripts/keycloak-user.sh crear deal-tracker-prod <usuario> <correo> [nombre] [apellido]
#
# Ese script es el procedimiento, y existe para que el alta deje rastro: el primer usuario de
# produccion se creo con `kcadm.sh` a mano y no aparece en ningun repositorio. Ojo con el
# `kcadm.sh create users` suelto que documentaba esta cabecera antes: crea el usuario SIN
# contrasena y sin UPDATE_PASSWORD, o sea alguien que existe y no puede entrar.
# La politica de alta —manual mientras no haya SMTP— esta razonada en docs/KEYCLOAK_USERS.md.
#
# El backend aprovisiona solo la fila en `app_user` a partir de `sub`, `email` y `name`, y lo
# hace en el PRIMER LOGIN: un usuario recien creado no existe todavia para la aplicacion.

clients:
  - clientId: deal-tracker-web
    enabled: true
    protocol: openid-connect

    # Client publico: sin secreto. Authorization Code + PKCE (S256).
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: true
    fullScopeAllowed: true

    redirectUris:
      - https://dealtracker.liontechsolution.com/*

    # Origen desnudo. Sin `/*`. Esto es lo que rompio QA en #219.
    webOrigins:
      - https://dealtracker.liontechsolution.com

    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: https://dealtracker.liontechsolution.com/*
      use.refresh.tokens: "true"
      backchannel.logout.session.required: "true"
      frontchannel.logout.session.required: "true"

    # KEYCLOAK_AUDIENCE=deal-tracker-web: la JwtStrategy del backend exige este `aud`.
    protocolMappers:
      - name: aud-deal-tracker-web
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: deal-tracker-web
          id.token.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"
          lightweight.claim: "false"

    # `profile` y `email` son los que traen name/preferred_username/email, que es de
    # donde el backend aprovisiona el usuario.
    defaultClientScopes:
      - web-origins
      - acr
      - roles
      - profile
      - basic
      - email
    optionalClientScopes:
      - address
      - phone
      - organization
      - offline_access
      - microprofile-jwt

  # Client confidencial del BACKEND, para el alta de usuarios por invitacion (issue #61).
  # No lo usa ningun navegador: no tiene flujo de login, solo client_credentials.
  #
  # EL SECRETO NO SE DECLARA AQUI. Lo genera Keycloak al crear el client y config-cli no lo
  # toca nunca: con `secret` ausente su `ClientImportService.isClientEqual` devuelve true sin
  # llegar a consultarlo, asi que la reconciliacion de las 04:00 no lo rota. Se extrae con
  # `scripts/keycloak-client-secret.sh` y se sella en k3s-local-apps-manifests.
  #
  # Contrato con el otro lado: KEYCLOAK_ADMIN_CLIENT_ID=deal-tracker-api y
  # KEYCLOAK_ADMIN_CLIENT_SECRET. Su ausencia apaga el registro entero (503), no rompe el
  # arranque. Ojo con la #62: al trasladar el realm a la instancia aislada, el secreto NO
  # viaja —la instancia nueva genera otro— y hay que re-sellarlo junto al KEYCLOAK_ISSUER_URL.
  - clientId: deal-tracker-api
    enabled: true
    protocol: openid-connect

    publicClient: false
    clientAuthenticatorType: client-secret
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true

    # SIN ESTO LA ADMIN API RESPONDE 403 CON EL ROL BIEN PUESTO. La autorizacion de la Admin
    # API mira `resource_access.realm-management.roles` DEL TOKEN, no el mapping del usuario:
    # sin full scope el rol se ve asignado en la consola y el claim no se emite. Es el fallo
    # mas caro de diagnosticar de todo esto.
    fullScopeAllowed: true

    # Menos que deal-tracker-web a proposito: este client nunca representa a una persona, asi
    # que profile/email/web-origins no le sirven de nada. `roles` es el imprescindible, es el
    # que emite resource_access. Declararlos explicitamente ademas evita que config-cli vea
    # una diferencia y reescriba el client en cada pasada del CronJob.
    #
    # En vivo veras un cuarto, `service_account`: lo anade Keycloak solo al encender
    # serviceAccountsEnabled y no se declara aqui porque es suyo. Medido tras una pasada
    # completa del CronJob: config-cli no se lo quita.
    defaultClientScopes:
      - roles
      - basic
      - acr
    optionalClientScopes: []

# EL UNICO USUARIO DECLARADO EN ESTE REPO, y no es una persona: es el service account que
# Keycloak crea solo al encender `serviceAccountsEnabled`. keycloak-config-cli no sabe
# asignarle su rol de ninguna otra forma —no es un campo del client, es un `users:` con
# `serviceAccountClientId`— y ninguna de las tres razones por las que los usuarios no se
# declaran aqui le aplica: no tiene contrasena que guardar, no se da de baja (se retira
# borrando su client) y la reconciliacion nocturna pasa de riesgo a garantia, porque revierte
# cualquier rol que alguien le anada a mano. Razonado en docs/KEYCLOAK_USERS.md.
#
# Esto NO abre la puerta a declarar a las personas de produccion: aqui solo van service
# accounts. El alta de personas sigue siendo `scripts/keycloak-user.sh`, por las razones de
# la cabecera de arriba.
#
# `manage-users` es mas de lo que hace falta —permite tambien borrar y deshabilitar—, pero no
# existe un rol builtin de «solo crear»: acotarlo exigiria un rol de cliente a medida. Queda
# escrito para que la decision sea revisable y no se herede por omision. Lo que NO hace falta
# es `view-users`: `UserPermissions.canView()` es `hasViewRole() || canManage()`, asi que
# buscar si el invitado ya existe funciona con esto solo.
#
# No se declaran `realmRoles` (config-cli respeta `default-roles-deal-tracker-prod`, porque
# `import.behaviors.remove-default-role-from-user` viene false de fabrica) ni los roles del
# client `account` (a los clients por defecto de Keycloak no les quita nada si no aparecen).
users:
  - username: service-account-deal-tracker-api
    enabled: true
    serviceAccountClientId: deal-tracker-api
    clientRoles:
      realm-management:
        - manage-users
