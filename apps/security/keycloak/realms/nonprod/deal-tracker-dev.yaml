# Realm deal-tracker-dev — declarado en git (issue #49)
#
# OJO CON EL NOMBRE: su consumidor real es el entorno QA de deal-tracker. El client
# `deal-tracker-web` no tiene ninguna redirect URI de dev; todas apuntan a
# dealtracker-qa.liontechsolution.com. Cambiar algo aqui afecta a QA.
#
# `webOrigins` espera ORIGENES DESNUDOS (esquema + host, sin ruta y sin `/*`).
# El navegador manda la cabecera `Origin` sin ruta: si aqui se escribe
# `https://host/*` no casa, Keycloak no emite `Access-Control-Allow-Origin` en la
# respuesta de /token y el login se rompe para todo usuario real — con los tests de
# API en verde, porque sin navegador no hay CORS. Eso es deal-tracker#219.
# El template del ConfigMap rechaza esa sintaxis en tiempo de render.
#
# Este fichero es deliberadamente minimo: declara lo que nos importa, no un export
# completo. Lo no declarado se queda como esta (import.managed.*=no-delete).
# Las PERSONAS no se declaran aqui: keycloak-config-cli no sabe borrar usuarios, y el CronJob
# de reconciliacion desharia cada noche cualquier baja. Eso no cambia con el SMTP de la #60 —
# ninguna de esas dos razones dependia del correo. Se dan de alta con
# `scripts/keycloak-user.sh`; el porque esta en docs/KEYCLOAK_USERS.md.
# El unico `users:` de este fichero —al final— es el service account de `deal-tracker-api`, que
# no es una persona y al que no le aplica ninguna de esas razones. Ahi solo van service
# accounts; ver la seccion correspondiente del mismo documento.

realm: deal-tracker-dev
enabled: true
sslRequired: external

loginWithEmailAllowed: true
duplicateEmailsAllowed: false
editUsernameAllowed: false

# Servidor de correo (issue #60). LA CONTRASENA NO ESTA AQUI: es la API key de Resend y entra
# por var-substitution desde el SealedSecret `keycloak-realm-smtp`, que config-cli recibe como
# variable de entorno. La referencia de abajo solo se resuelve con
# `realmConfig.varSubstitution.enabled`; si la variable falta, el import de los DOS realms
# aborta en vez de escribir la cadena literal como contrasena.
#
# NO ESCRIBAS UNA REFERENCIA DE EJEMPLO EN UN COMENTARIO DE ESTE FICHERO. La sustitucion se
# hace sobre el TEXTO CRUDO antes de parsear el YAML, asi que los comentarios tambien entran:
# un `env:...` de adorno en un comentario se intenta resolver como variable, no se resuelve, y
# tira abajo el import de los dos realms. Paso al escribir este bloque.
#
# EL REMITENTE ES COPIA LITERAL del `INVITE_FROM_EMAIL` del backend de QA, que hoy vale
# `deal-tracker@qa.liontechsolution.com` (`deal-tracker/overlays/qa/patch-web-deployment.yaml`
# en k3s-local-apps-manifests). Tiene que coincidir entero, buzon incluido: el usuario recibe
# la invitacion de la aplicacion y la recuperacion de Keycloak, y que vengan de sitios
# distintos es lo que cualquiera lee como phishing.
#
# OJO AL DOMINIO, que no es el que parece. El de QA es `qa.liontechsolution.com`, generico del
# entorno — NO `dealtracker-qa.…`, que es el host de la SPA (ese es el `APP_PUBLIC_URL`, otra
# variable). Produccion si usa `dealtracker.liontechsolution.com` en las dos cosas, asi que la
# simetria enganna. Poner el host de la SPA aqui da un `550 This API key is not authorized to
# send emails from ...`: la key es valida y el SMTP conecta, pero Resend no tiene ese dominio.
# Comprobado asi el 22/08/2026. Si cambia el remitente del backend, cambia aqui.
#
# Y ojo con la NetworkPolicy: el 587 se abre en `networkPolicy.smtp` del chart. Sin esa regla
# no sale un correo y el sintoma no señala ahi.
smtpServer:
  host: smtp.resend.com
  port: "587"
  auth: "true"
  starttls: "true"
  ssl: "false"
  user: resend
  password: $(env:SMTP_PASSWORD_DEAL_TRACKER_DEV)
  from: deal-tracker@qa.liontechsolution.com
  fromDisplayName: Deal Tracker QA

# Con SMTP ya se puede: recuperar la contrasena sin pasar por un administrador, y comprobar
# que el correo del alta es de quien dice serlo.
verifyEmail: true
resetPasswordAllowed: true

# SIGUE EN false, y el motivo ya NO es la falta de correo —esa razon se fue con el bloque de
# arriba—. El alta de la v0.8.0 es POR INVITACION: la crea el backend por la Admin API tras
# canjear un token de un solo uso, no la pagina de registro de Keycloak. Abrir esto convertiria
# el producto en otro, y es una decision de producto, no tecnica.
registrationAllowed: false
registrationEmailAsUsername: false

# Hoy no habia ninguna, o sea que una contrasena nueva no tenia ningun minimo. Como el alta por
# invitacion fija la contrasena POR LA ADMIN API, el realm es el unico sitio donde esa politica
# puede vivir: si no esta aqui, no esta en ninguna parte.
#
# Longitud y nada de composicion, siguiendo NIST 800-63B: exigir mayuscula/digito/simbolo
# produce `Password1!` y contrasenas reutilizadas, no entropia. `passwordHistory(3)` evita que
# el UPDATE_PASSWORD forzado se resuelva repitiendo la temporal que reparte keycloak-user.sh.
# No es retroactiva: solo actua al fijar una contrasena nueva.
passwordPolicy: "length(12) and notUsername and notEmail and passwordHistory(3)"

clients:
  - clientId: deal-tracker-web
    enabled: true
    protocol: openid-connect

    # Client publico: sin secreto. Authorization Code + PKCE (S256).
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: true
    fullScopeAllowed: true

    redirectUris:
      - https://dealtracker-qa.liontechsolution.com/*

    # Origen desnudo. Sin `/*`. Leer la cabecera del fichero antes de tocar esto.
    webOrigins:
      - https://dealtracker-qa.liontechsolution.com

    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: https://dealtracker-qa.liontechsolution.com/*
      use.refresh.tokens: "true"
      backchannel.logout.session.required: "true"
      frontchannel.logout.session.required: "true"

    # El backend valida `aud`: sin este mapper los tokens dejan de servirle.
    protocolMappers:
      - name: aud-deal-tracker-web
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: deal-tracker-web
          id.token.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"
          lightweight.claim: "false"

    defaultClientScopes:
      - web-origins
      - acr
      - roles
      - profile
      - basic
      - email
    optionalClientScopes:
      - address
      - phone
      - organization
      - offline_access
      - microprofile-jwt

  # Client confidencial del BACKEND, para el alta de usuarios por invitacion (issue #61).
  # No lo usa ningun navegador: no tiene flujo de login, solo client_credentials.
  #
  # EL SECRETO NO SE DECLARA AQUI. Lo genera Keycloak al crear el client y config-cli no lo
  # toca nunca: con `secret` ausente su `ClientImportService.isClientEqual` devuelve true sin
  # llegar a consultarlo, asi que la reconciliacion de las 04:00 no lo rota. Se extrae con
  # `scripts/keycloak-client-secret.sh` y se sella en k3s-local-apps-manifests.
  - clientId: deal-tracker-api
    enabled: true
    protocol: openid-connect

    publicClient: false
    clientAuthenticatorType: client-secret
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true

    # SIN ESTO LA ADMIN API RESPONDE 403 CON EL ROL BIEN PUESTO. La autorizacion de la Admin
    # API mira `resource_access.realm-management.roles` DEL TOKEN, no el mapping del usuario:
    # sin full scope el rol se ve asignado en la consola y el claim no se emite. Es el fallo
    # mas caro de diagnosticar de todo esto.
    fullScopeAllowed: true

    # Menos que deal-tracker-web a proposito: este client nunca representa a una persona, asi
    # que profile/email/web-origins no le sirven de nada. `roles` es el imprescindible, es el
    # que emite resource_access. Declararlos explicitamente ademas evita que config-cli vea
    # una diferencia y reescriba el client en cada pasada del CronJob.
    #
    # En vivo veras un cuarto, `service_account`: lo anade Keycloak solo al encender
    # serviceAccountsEnabled y no se declara aqui porque es suyo. Medido tras una pasada
    # completa del CronJob: config-cli no se lo quita.
    defaultClientScopes:
      - roles
      - basic
      - acr
    optionalClientScopes: []

# EL UNICO USUARIO DECLARADO EN ESTE REPO, y no es una persona: es el service account que
# Keycloak crea solo al encender `serviceAccountsEnabled`. keycloak-config-cli no sabe
# asignarle su rol de ninguna otra forma —no es un campo del client, es un `users:` con
# `serviceAccountClientId`— y ninguna de las tres razones por las que los usuarios no se
# declaran aqui le aplica: no tiene contrasena que guardar, no se da de baja (se retira
# borrando su client) y la reconciliacion nocturna pasa de riesgo a garantia, porque revierte
# cualquier rol que alguien le anada a mano. Razonado en docs/KEYCLOAK_USERS.md.
#
# Esto NO abre la puerta a declarar usuarios: aqui solo van service accounts.
#
# `manage-users` es mas de lo que hace falta —permite tambien borrar y deshabilitar—, pero no
# existe un rol builtin de «solo crear»: acotarlo exigiria un rol de cliente a medida. Queda
# escrito para que la decision sea revisable y no se herede por omision. Lo que NO hace falta
# es `view-users`: `UserPermissions.canView()` es `hasViewRole() || canManage()`, asi que
# buscar si el invitado ya existe funciona con esto solo.
#
# No se declaran `realmRoles` (config-cli respeta `default-roles-deal-tracker-dev`, porque
# `import.behaviors.remove-default-role-from-user` viene false de fabrica) ni los roles del
# client `account` (a los clients por defecto de Keycloak no les quita nada si no aparecen).
users:
  - username: service-account-deal-tracker-api
    enabled: true
    serviceAccountClientId: deal-tracker-api
    clientRoles:
      realm-management:
        - manage-users

# ============================================================================
# ENTRAR CON GOOGLE (deal-tracker#682)
#
# LO PRIMERO, porque es lo que nadie espera: `registrationAllowed: false` NO gobierna el
# login federado. Quien decide si un desconocido consigue cuenta es el flow de First
# Broker Login, y el built-in de Keycloak lleva `idp-create-user-if-unique`, que da de
# alta a CUALQUIERA con cuenta de Google. Un IdP anadido sin tocar el flow es registro
# publico abierto, y no lo parece por ningun lado.
#
# De ahi este flow, que va ANTES que el IdP porque el IdP lo referencia. Lleva dos
# autenticadores y lo importante es el que NO lleva:
#   - idp-detect-existing-broker-user   busca por correo un usuario que YA exista
#   - idp-auto-link                     lo enlaza
# Sin `idp-create-user-if-unique` un desconocido no encuentra a nadie y el flujo muere.
# El invitado si entra, porque el backend le pre-creo la cuenta un segundo antes de
# mandarlo a Google. O sea: GOOGLE NUNCA DA DE ALTA, LA INVITACION SI.
#
# Medido el 04/09/2026 con una cuenta de Google real contra un Keycloak 26.5.1
# desechable: sin pre-crear, el rechazo es real (401, cero usuarios creados, y un evento
# IDENTITY_PROVIDER_FIRST_LOGIN_ERROR con error=user_not_found que ademas lo hace
# observable); pre-creando, el mismo usuario entra sin teclear contrasena.
#
# NO METAS AQUI `idp-review-profile`. Ese autenticador escribe el formulario enviado de
# vuelta en el contexto federado, y `idp-detect-existing-broker-user` empareja por el
# correo DE ESE CONTEXTO: la combinacion «review-profile + auto-link» deja que cualquiera
# teclee el correo de un invitado y se enlace a su cuenta. El built-in se lo permite
# porque lo compensa con `idp-confirm-link` y verificacion por correo, que es justo lo
# que aqui se ha quitado.
#
# ESTE FLOW SE CREA UNA VEZ Y NO SE CAMBIA EN SU SITIO. Medido: config-cli borra y recrea
# los flows no-builtin, y el DELETE da 500 mientras algo lo referencie, asi que cambiarle
# hasta la descripcion deja el import fallando cada noche —y con el, cualquier otro cambio
# del realm—. El fallo es fail-safe (el realm queda como estaba), pero para cambiarlo hay
# que ir en blue/green: alias NUEVO y repunte de las dos referencias en el MISMO import, y
# retirar el viejo en uno posterior. Nunca desapuntar para cambiar: eso deja el built-in
# —el que crea usuarios— en juego mientras dure.
authenticationFlows:
  - alias: alta-solo-por-invitacion
    description: "Enlaza con un usuario que YA existe. Nunca crea cuentas (deal-tracker#682)."
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: idp-detect-existing-broker-user
        requirement: REQUIRED
        priority: 10
        userSetupAllowed: false
      - authenticator: idp-auto-link
        requirement: REQUIRED
        priority: 20
        userSetupAllowed: false

# EL BINDING DE REALM, Y NO ES REDUNDANCIA CON EL DEL IdP.
#
# El `firstBrokerLoginFlowAlias` del IdP es un OVERRIDE. Si queda vacio o su alias no
# resuelve, Keycloak cae a ESTE binding, que de fabrica es el built-in `first broker
# login` — el que si crea usuarios. Medido dejando el campo del IdP vacio: el desconocido
# pasa de 401 a 302 y SE LE CREA LA CUENTA, sin un error, sin un aviso y sin nada en
# ningun log. Un typo en el alias o un PUT parcial del IdP abren el registro en silencio.
#
# Con esto puesto el fallback tambien es fail-closed (medido: vuelve el 401), y cualquier
# IdP que alguien anada en el futuro sin override hereda la politica segura.
firstBrokerLoginFlow: alta-solo-por-invitacion

# EL PRIMER identityProviders DE ESTE REPO.
#
# `trustEmail: true` porque quien acaba de demostrar la propiedad del correo es Google, y
# mandarle ademas nuestro correo de verificacion es pedirle que pruebe dos veces lo mismo.
# `storeToken: false` porque no llamamos a ninguna API de Google: el id_token se usa una
# vez para autenticar y se tira — que es tambien por lo que la caducidad de 7 dias de las
# autorizaciones en modo Testing no nos afecta.
#
# `syncMode: FORCE` es lo que hace que el apellido de relleno que nuestra alta se ve
# obligada a poner desaparezca solo en el primer login federado, SIN un solo mapper
# (medido: pasa a ser el apellido real de Google). Tiene precio y es una decision, no un
# efecto secundario: FORCE pisa tambien el `firstName` en CADA login, o sea que el nombre
# entero que la persona tecleo en el alta se sustituye por el `given_name` de Google. Si
# alguien lo baja a IMPORT, que sepa que entonces el relleno se queda para siempre: en
# este diseno el broker nunca CREA al usuario, solo lo enlaza, e IMPORT significa «solo al
# crear».
#
# EL SECRETO NO ESTA AQUI, igual que la clave de Resend: entra por var-substitution desde
# el SealedSecret, re-sellado POR INSTANCIA. Aplica la advertencia en mayusculas del bloque
# del SMTP, mas arriba, sobre no escribir marcadores de ejemplo en los comentarios.
#
# El client de Google es PROPIO DE ESTA INSTANCIA, mismo criterio que el SMTP y el bot: una
# fuga de la credencial de pruebas no puede alcanzar al dominio de produccion. Su redirect
# URI dada de alta en Google es la de este realm y este host.
identityProviders:
  - alias: google
    displayName: Continuar con Google
    providerId: google
    enabled: true
    trustEmail: true
    storeToken: false
    linkOnly: false
    addReadTokenRoleOnCreate: false
    firstBrokerLoginFlowAlias: alta-solo-por-invitacion
    config:
      # El clientId NO es un secreto: Google lo publica en la URL de autorizacion de
      # cada login, asi que va literal. Es propio de ESTA instancia.
      clientId: "314849492897-ckknet2pv53si8vccba4kq4igaoa0fo5.apps.googleusercontent.com"
      clientSecret: "$(env:GOOGLE_CLIENT_SECRET_DEAL_TRACKER_DEV)"
      defaultScope: "openid profile email"
      syncMode: FORCE
      prompt: select_account
