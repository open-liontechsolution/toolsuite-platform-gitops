apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-local-dev
  namespace: argocd
  annotations:
    # ESTA ES LA QUE CIERRA LA #68, y VA EN UNA ANOTACION Y NO EN syncOptions.
    # `ServerSideDiff` es una compare-option, no una opcion de sync: gobierna como se
    # CALCULA el diff. Puesto en `spec.syncPolicy.syncOptions` se ignora en silencio
    # — probado el 18/09/2026: la Application recomparaba con la opcion en el spec y
    # seguia OutOfSync.
    #
    # El sintoma era un `OutOfSync` permanente del StatefulSet que ningun sync
    # cerraba. La causa es que aplicabamos con ServerSideApply pero comparabamos en
    # modo CLIENTE, o sea las dos mitades por mecanismos distintos: el diff de
    # cliente compara el manifiesto crudo contra el objeto vivo, y el manifiesto
    # declara campos que el API server NO PUEDE GUARDAR (`volumes: null`, que el
    # subchart emite siempre, y los zero-values con omitempty). El apply los tira, el
    # diff los echa de menos, y la comparacion vuelve a diferir justo despues de cada
    # sync — la asimetria que la #68 identifico como "la pista buena".
    #
    # Medido sin tocar nada, que es como se confirmo: un `kubectl apply
    # --server-side --dry-run=server` del render devuelve un objeto IDENTICO al vivo,
    # campo por campo, en dev y en prod. Por el camino servidor no hay nada que ver.
    #
    # La #68 habia probado `ignoreDifferences` de tres formas (jsonPointers,
    # + RespectIgnoreDifferences=true, y jqPathExpressions) y ninguna funciono: son
    # parches sobre el RESULTADO de un diff calculado con el mecanismo que no toca.
    # Esto cambia el mecanismo.
    #
    # Desde ArgoCD v3.1.0 esto es automatico para toda Application con
    # ServerSideApply. Aqui corre la 2.12.3, asi que hay que declararlo; al subir de
    # version la anotacion pasa a ser redundante pero NO molesta.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tools
  
  source:
    repoURL: https://github.com/open-liontechsolution/toolsuite-platform-gitops
    path: apps/security/keycloak
    targetRevision: main
    helm:
      releaseName: keycloak-dev
      valueFiles:
        - values.yaml
        - environments/local/dev.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: security-dev
  
  syncPolicy:
    # SIN `automated`, a proposito. No es un olvido.
    #
    # Este chart despliega los realms de deal-tracker por keycloak-config-cli, y
    # ahi viven el realm contra el que se autentica QA (`deal-tracker-dev`) y el
    # de PRODUCCION (`deal-tracker-prod`). Un auto-sync con prune+selfHeal
    # llevaria cualquier error de `realms/` al IdP sin que nadie mirase: un
    # `webOrigins` mal puesto tumba el login entero, y ya paso una vez
    # (deal-tracker#219). La ventana de revision manual es deliberada.
    #
    # La reconciliacion NO depende de que alguien sincronice: de eso se encarga el
    # CronJob de config-cli de las 04:00. Esta razonado en README.md, seccion
    # "Como se ejecuta" — si se cambia esto, ese parrafo entero deja de ser cierto.
    #
    # El sync se lanza a mano tras revisar el diff:
    #   argocd app diff keycloak-local-dev --local apps/security/keycloak
    #   argocd app sync keycloak-local-dev
    # o, sin la CLI:
    #   kubectl -n argocd patch app keycloak-local-dev --type merge \
    #     -p '{"operation":{"sync":{"syncOptions":["CreateNamespace=true","ServerSideApply=true"]}}}'
    #
    # LAS syncOptions SE REPITEN AHI A PROPOSITO, aunque esten declaradas justo debajo:
    # una operacion lanzada a mano NO hereda `spec.syncPolicy.syncOptions`. Argo
    # sincroniza con las de la propia operacion, asi que un `{"sync":{}}` a secas las
    # pierde LAS DOS y no lo dice. Con `CreateNamespace` perdido, el sync falla con
    # `namespaces "..." not found`; con `ServerSideApply` perdido no falla nada — se
    # aplica del otro modo y ya esta. Medido el 22/08/2026 desplegando la #62: la
    # operacion quedo registrada como {"sync": {}} con las dos opciones en el spec.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
