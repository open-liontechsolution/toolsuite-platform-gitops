apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-local-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tools

  source:
    repoURL: https://github.com/open-liontechsolution/toolsuite-platform-gitops
    path: apps/security/keycloak
    targetRevision: main
    helm:
      releaseName: keycloak-prod
      valueFiles:
        - values.yaml
        - environments/local/prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: security-prod

  syncPolicy:
    # SIN `automated`, por el mismo motivo que `keycloak-local-dev` y con mas razon: aqui
    # el unico realm que hay es el de PRODUCCION. Un auto-sync con prune+selfHeal llevaria
    # cualquier error de `realms/prod` al IdP sin que nadie lo mirase, y un `webOrigins`
    # mal puesto tumba el login entero — ya paso una vez (deal-tracker#219).
    #
    # La reconciliacion NO depende de que alguien sincronice: de eso se encarga el CronJob
    # de config-cli de las 04:00 con `cache.enabled: false`.
    #
    # El sync se lanza a mano tras revisar el diff:
    #   argocd app diff keycloak-local-prod --local apps/security/keycloak
    #   argocd app sync keycloak-local-prod
    # o, sin la CLI:
    #   kubectl -n argocd patch app keycloak-local-prod --type merge \
    #     -p '{"operation":{"sync":{"syncOptions":["CreateNamespace=true","ServerSideApply=true"]}}}'
    #
    # LAS syncOptions SE REPITEN AHI A PROPOSITO, aunque esten declaradas justo debajo:
    # una operacion lanzada a mano NO hereda `spec.syncPolicy.syncOptions`. Argo
    # sincroniza con las de la propia operacion, asi que un `{"sync":{}}` a secas las
    # pierde LAS DOS y no lo dice. Con `CreateNamespace` perdido, el sync falla con
    # `namespaces "..." not found`; con `ServerSideApply` perdido no falla nada — se
    # aplica del otro modo y ya esta. Medido el 22/08/2026 desplegando la #62: la
    # operacion quedo registrada como {"sync": {}} con las dos opciones en el spec.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Igual que en dev, y por el mismo motivo: cierra el `OutOfSync` permanente de
      # la #68. Aplicabamos con ServerSideApply y comparabamos en modo cliente, asi
      # que el diff veia campos que el apply descarta (`volumes: null` del subchart y
      # los zero-values con omitempty). Gobierna la COMPARACION, no el sync, asi que
      # va en el spec y no en la operacion a mano. El razonamiento largo y lo medido
      # estan en el fichero de dev.
      - ServerSideDiff=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Igual que en dev: el chart de codecentric no gestiona `replicas` una vez desplegado.
  #
  # ESTA APPLICATION NACIO `OutOfSync` PERMANENTE (issue #68) y desde el 18/09/2026 ya
  # no lo esta. Se deja escrito porque el diagnostico de entonces era correcto en los
  # sintomas y equivocado en la conclusion, y conviene no repetirlo:
  #
  # Se creia que la causa eran tres campos irreconciliables —la etiqueta
  # `app.kubernetes.io/instance` y dos zero-values del StatefulSet que el API server
  # borra al guardar— y que no tenian arreglo aqui. En realidad los tres eran el
  # SINTOMA: se comparaba en modo cliente lo que se aplicaba en modo servidor, asi que
  # el diff echaba de menos justo lo que el apply descarta. La etiqueta ni siquiera
  # contaba: Argo excluye del diff su propia etiqueta de tracking.
  #
  # El arreglo es `ServerSideDiff=true` en las syncOptions de arriba.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
