{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "keycloak.fullname" . }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "keycloak.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloakx
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.databaseNamespace }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    {{- if .Values.networkPolicy.smtp.enabled }}
    {{- /*
      SIN ESTA REGLA NO SALE UN SOLO CORREO, y el sintoma no señala aqui: Keycloak se
      queda esperando un socket que nunca abre y el usuario ve "no me llega el correo",
      no "la policy lo corta".

      Y no vale con anadir el 587 a la regla de arriba: esa lleva `namespaceSelector`,
      que SOLO casa pods del cluster. Para salir a smtp.resend.com hace falta un
      `ipBlock` — o sea que el 443 de ahi arriba NO llega a internet.

      (Este comentario decia ademas "y hoy no hay ninguno en toda la policy". Dejo de ser
      cierto con la regla del IdP de abajo, que existe justamente porque ese 443 corto no
      llegaba a Google: deal-tracker#812.)

      Acotado al puerto del SMTP y con los rangos privados en `except`, para que abrir
      la salida a internet no sea ademas abrir la salida al resto del cluster ni a la
      red de casa.
    */}}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.networkPolicy.smtp.except | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.smtp.port }}
    {{- end }}
    {{- if .Values.networkPolicy.idp.enabled }}
    {{- /*
      SIN ESTA REGLA NO FUNCIONA NINGUN IdP FEDERADO, y el sintoma señala a cualquier
      sitio menos aqui: quien entra por "Continuar con Google" se autentica bien, vuelve
      con su `code`, y recibe un 524 del proxy ~100s despues. Keycloak lo registra como
      `java.net.SocketException: Network is unreachable` contra oauth2.googleapis.com.

      El canje del `code` es una llamada SERVIDOR A SERVIDOR de Keycloak a Google: que el
      navegador del usuario llegue a Google no dice nada de si llega este pod. Por eso el
      443 de la regla de `namespaceSelector` no vale — solo casa pods del cluster.

      Acotado al 443 y con los rangos privados en `except`, igual que SMTP.
    */}}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.networkPolicy.idp.except | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.idp.port }}
    {{- end }}
{{- end }}
