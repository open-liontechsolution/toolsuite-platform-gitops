{{- if .Values.realmConfig.smtpSecret.enabled }}
{{- /*
  Las contrasenas del servidor de correo de los realms (issue #60). Una por realm, porque
  cada uno manda desde su propio dominio verificado en Resend: la de QA no puede servir para
  mandar como produccion.

  SECRET PROPIO, NO `keycloak-admin-credentials`. Aquel entra por `extraEnvFrom` en el pod
  del SERVIDOR, y estas claves solo las necesita keycloak-config-cli: meterlas alli las
  dejaria en el entorno de un proceso que no las usa. Mismo criterio que `apps/data/cnpg`,
  que separa `sealedSecret` (credenciales de la base) de `backupSecret` (la de S3).

  El sellado es POR NAMESPACE Y POR NOMBRE de secret: estos ciphertexts solo valen para
  `security-dev` y para el nombre de abajo. Cuando la #62 se lleve produccion a su propia
  instancia, su clave hay que volver a sellarla contra el namespace nuevo.
*/}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.realmConfig.smtpSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.realmConfig.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- range $key, $value := .Values.realmConfig.smtpSecret.encryptedData }}
    {{ $key }}: {{ required (printf "realmConfig.smtpSecret.encryptedData.%s esta vacio: sellalo con kubeseal antes de desplegar" $key) $value | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ .Values.realmConfig.smtpSecret.name }}
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "keycloak.realmConfig.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
