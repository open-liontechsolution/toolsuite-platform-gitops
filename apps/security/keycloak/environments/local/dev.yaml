# Local Development Environment Configuration
# Namespace: security-dev
# Deployment: local k3s cluster with Longhorn storage
# Codecentric Keycloakx Chart

keycloakx:
  fullnameOverride: keycloak-dev

  # Single replica for dev
  replicas: 1

  # Keycloak startup command
  command:
    - "/opt/keycloak/bin/kc.sh"
  args:
    - "start"
    - "--hostname-strict=false"
    - "--proxy-headers=xforwarded"

  # Inject configuration from Secret and ConfigMap
  extraEnvFrom: |
    - secretRef:
        name: keycloak-admin-credentials
    - configMapRef:
        name: keycloak-config

  # Service configuration
  service:
    type: ClusterIP

  # Ingress disabled for dev
  ingress:
    enabled: false

  # Dev resource limits
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

  # Pod labels for dev environment
  podLabels:
    app.kubernetes.io/part-of: security-platform
    environment: dev
    deployment: local

  # Node affinity to schedule on worker nodes only
  affinity: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: In
                values:
                  - "true"
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                {{- include "keycloak.selectorLabels" . | nindent 12 }}
            topologyKey: kubernetes.io/hostname

  # Persistent volume for Keycloak data
  volumeClaimTemplates: |
    - metadata:
        name: keycloak-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

  # Mount the persistent volume to Keycloak data directory
  extraVolumeMounts: |
    - name: keycloak-data
      mountPath: /opt/keycloak/data

  # External access no longer needs a sidecar: keycloak-dev.liontechsolution.com is served
  # by the cluster-wide shared tunnel (k3s-nonprod, ns cloudflared), which reaches this
  # release over keycloak-dev-http:80 -> targetPort http -> 8080 — the same origin the
  # sidecar used to point at over localhost.

  # Extra Kubernetes manifests to deploy
  extraManifests:
    - |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: keycloak-config
        namespace: {{ .Release.Namespace }}
        labels:
          app.kubernetes.io/name: {{ include "keycloak.name" . }}
          app.kubernetes.io/instance: {{ .Release.Name }}
      data:
        KC_HEALTH_ENABLED: "true"
        KC_METRICS_ENABLED: "false"
        KC_HTTP_ENABLED: "true"
        KC_HOSTNAME_STRICT: "false"
        KC_DB_SCHEMA: keycloak
        JAVA_OPTS_APPEND: "-Djgroups.dns.query=keycloak-dev-headless"

# Consolidated SealedSecret with all Keycloak configuration
# User will populate encrypted values using kubeseal
sealedSecret:
  enabled: true
  name: keycloak-admin-credentials
  encryptedData:
    # Admin credentials
    KEYCLOAK_ADMIN: 
    KEYCLOAK_ADMIN_PASSWORD: 
    # Database configuration
    KC_DB: 
    KC_DB_PASSWORD: 
    KC_DB_URL_DATABASE: 
    KC_DB_URL_HOST: 
    KC_DB_URL_PORT: 
    KC_DB_USERNAME: 

# NetworkPolicy for cross-namespace database connectivity
networkPolicy:
  enabled: true
  databaseNamespace: "data-dev"
