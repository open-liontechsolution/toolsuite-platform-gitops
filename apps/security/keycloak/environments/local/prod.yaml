# PRODUCCION — instancia de Keycloak AISLADA (issue #62)
# Namespace: security-prod
# Base de datos: keycloak_prod @ platform-postgres-prod, namespace data-prod
# (era keycloak-postgres-prod hasta la #71, que lo renombro al hacerlo general del tier)
# Host publico: keycloak.liontechsolution.com, por el tunnel k3s-prod (ns cloudflared-prod)
#
# POR QUE EXISTE ESTE FICHERO. Hasta la #62 el realm `deal-tracker-prod` corria en la
# instancia de dev (`security-dev/keycloak-dev-0`, keycloak-dev.liontechsolution.com). Se
# acepto a proposito para no bloquear el estreno, con dos consecuencias escritas: si esa
# instancia caia, caia el login de produccion, y los usuarios de produccion veian
# `keycloak-dev` en la barra. La v0.8.0 abre el registro por invitacion, y mover un realm
# con dos usuarios es un export/import mientras que moverlo con cien es una migracion con
# gente dentro. De ahi el orden: traslado primero, registro despues.
#
# NO ES UNA RESURRECCION del values de `prod` que existio desde el commit inicial. Aquel
# nunca se desplego y no habria funcionado (anidaba bajo `keycloak:` cuando el subchart es
# `keycloakx`, apuntaba a namespaces inexistentes y llevaba REPLACE_WITH_ENCRYPTED_*).
# Esta escrito de cero sobre el de dev, que si funciona.

keycloakx:
  fullnameOverride: keycloak-prod

  replicas: 1

  command:
    - "/opt/keycloak/bin/kc.sh"
  args:
    - "start"
    - "--hostname-strict=false"
    - "--proxy-headers=xforwarded"

  extraEnvFrom: |
    - secretRef:
        name: keycloak-admin-credentials
    - configMapRef:
        name: keycloak-config

  service:
    type: ClusterIP

  # El Ingress se queda apagado: la publicacion la hace el tunnel, no un Ingress.
  ingress:
    enabled: false

  # EL LIMITE DE CPU ES DE ARRANQUE, NO DE REGIMEN. Keycloak re-augmenta la imagen de
  # Quarkus en CADA arranque ("Changes detected in configuration. Updating the server
  # image"): `KC_DB` llega por variable de entorno y es una opcion de BUILD, asi que el
  # servidor se reconstruye antes de servir. Ese paso es CPU-bound.
  #
  # Con `limits.cpu: 1` —lo que llevaba dev— el pod se queda clavado en 1000m exactos y
  # la re-augmentacion no termina dentro del presupuesto de la startupProbe: kubelet lo
  # mata, y al reiniciar vuelve a empezar de cero. Es un bucle, y el sintoma enganna
  # porque el log se queda en "Please wait" sin un solo error y el pod no reinicia por
  # fallo propio. Medido el 22/08/2026: 3 reinicios, pod al 100% de su limite y worker3
  # al 38% de sus 4 nucleos — o sea que la CPU estaba libre y quien apretaba era el
  # limite.
  #
  # En regimen consume 3m. El limite alto solo se usa durante los primeros minutos.
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "3"
      memory: "2Gi"

  # Y el presupuesto de la sonda, por el mismo motivo: 15s + 60*5s = 315s no llegan para
  # una re-augmentacion en hardware de Raspberry Pi. 15 + 120*5 = 615s (~10 min) si.
  # No afecta al arranque normal: la sonda deja de contar en cuanto /health responde.
  startupProbe: |
    httpGet:
      path: '{{ tpl .Values.http.relativePath $ | trimSuffix "/" }}/health'
      port: '{{ .Values.http.internalPort }}'
      scheme: '{{ .Values.http.internalScheme }}'
    initialDelaySeconds: 15
    timeoutSeconds: 1
    failureThreshold: 120
    periodSeconds: 5

  podLabels:
    app.kubernetes.io/part-of: security-platform
    environment: prod
    deployment: local

  # Solo nodos worker, igual que dev: los control-plane de este cluster no resuelven
  # registries externos de forma fiable.
  affinity: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: In
                values:
                  - "true"
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                {{- include "keycloak.selectorLabels" . | nindent 12 }}
            topologyKey: kubernetes.io/hostname

  volumeClaimTemplates: |
    - metadata:
        name: keycloak-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

  extraVolumeMounts: |
    - name: keycloak-data
      mountPath: /opt/keycloak/data

  # Acceso externo: keycloak.liontechsolution.com lo sirve el tunnel compartido de
  # PRODUCCION (k3s-prod, ns cloudflared-prod), el mismo que ya publica
  # dealtracker.liontechsolution.com. NO el de no-produccion: meter el login de produccion
  # en el tunnel que sirve dev y QA es justo el blast radius que motivo tener dos.
  #
  # La ruta NO esta en ningun repo: el tunnel es remotely-managed y la tabla vive en Zero
  # Trust (Networks -> Tunnels -> k3s-prod -> Public Hostnames). Los valores exactos:
  #   Subdomain  keycloak
  #   Domain     liontechsolution.com
  #   Path       (vacio)
  #   Type       HTTP
  #   URL        keycloak-prod-http.security-prod.svc.cluster.local:80
  # El puerto es el del Service (80), no el del contenedor (8080). El TLS lo termina
  # Cloudflare; el salto interno va en claro por la red del cluster.
  #
  # Y el host NO es libre: entra en el KEYCLOAK_ISSUER_URL que valida el backend
  # (k3s-local-apps-manifests, deal-tracker/overlays/prod). Cambiarlo aqui obliga a
  # resellar alli.

  extraManifests:
    - |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: keycloak-config
        namespace: {{ .Release.Namespace }}
        labels:
          app.kubernetes.io/name: {{ include "keycloak.name" . }}
          app.kubernetes.io/instance: {{ .Release.Name }}
      data:
        KC_HEALTH_ENABLED: "true"
        KC_METRICS_ENABLED: "false"
        KC_HTTP_ENABLED: "true"
        KC_HOSTNAME_STRICT: "false"
        KC_DB_SCHEMA: keycloak
        # El headless es el de ESTA release. Copiarlo de dev deja a los pods buscando
        # miembros del cluster de dev, que es un fallo silencioso mientras haya un replica.
        JAVA_OPTS_APPEND: "-Djgroups.dns.query=keycloak-prod-headless"

# Credenciales de admin y de la base de datos.
#
# SELLADAS CONTRA security-prod, y NO son las de dev: el sellado va atado a namespace +
# nombre, asi que los ciphertexts de `security-dev` no valen aqui aunque el plaintext
# fuera el mismo. El admin de esta instancia es propio y distinto del de dev — que es
# medio motivo de aislarla.
#
# KC_DB_PASSWORD lleva el MISMO plaintext que `sealedSecret.encryptedData.password` de
# apps/data/platform-postgres/environments/local/prod.yaml, sellado una segunda vez contra
# el otro namespace. Si se rota, se rotan los dos en el mismo commit: si divergen, Keycloak
# no arranca y el error que da es de autenticacion contra Postgres.
sealedSecret:
  enabled: true
  name: keycloak-admin-credentials
  encryptedData:
    KEYCLOAK_ADMIN: 
    KEYCLOAK_ADMIN_PASSWORD: 
    KC_DB: 
    KC_DB_USERNAME: 
    KC_DB_PASSWORD: 
    KC_DB_URL_HOST: 
    KC_DB_URL_PORT: 
    KC_DB_URL_DATABASE: 

# NetworkPolicy de egress. `databaseNamespace` apunta al CNPG propio de esta instancia,
# no a data-dev.
networkPolicy:
  enabled: true
  databaseNamespace: "data-prod"
  # Salida a smtp.resend.com:587. Es la UNICA regla de esta policy que sale de verdad a
  # internet (las demas van por namespaceSelector, que solo casa pods del cluster). Sin
  # ella Keycloak no manda un correo y el sintoma se lee como "no llega", no como un
  # socket cortado. Ver el values base.
  smtp:
    enabled: true

# Realms declarados en git. El resto de la configuracion esta en el values.yaml base.
realmConfig:
  enabled: true
  keycloakUrl: "http://keycloak-prod-http"

  # SOLO el realm de produccion. El glob no entra en subdirectorios, asi que esta
  # instancia no ve `realms/nonprod` y la de dev no ve este. Ese reparto es la mitad del
  # aislamiento: la otra mitad es el pod.
  path: realms/prod

  varSubstitution:
    enabled: true

  # LA API KEY DE RESEND, RE-SELLADA CONTRA security-prod. Es el mismo plaintext que en
  # el values de dev —la misma key de Resend, que sigue mandando desde el dominio
  # verificado de produccion— pero el ciphertext de `security-dev` NO vale aqui.
  #
  # PENDIENTE DE PEGAR. Con el valor vacio el render falla a proposito (el template lleva
  # un `required`), que es mejor que desplegar un config-cli que aborta el import. Y con
  # `varSubstitution` encendido y la variable ausente, config-cli aborta el import ENTERO
  # en vez de escribir "$(env:...)" como contrasena de correo.
  #
  #   kubectl -n security-dev get secret keycloak-realm-smtp \
  #     -o jsonpath='{.data.SMTP_PASSWORD_DEAL_TRACKER_PROD}' | base64 -d \
  #   | kubeseal --raw --from-file=/dev/stdin \
  #       --namespace security-prod --name keycloak-realm-smtp \
  #       --controller-name sealed-secrets --controller-namespace kube-system
  smtpSecret:
    enabled: true
    name: keycloak-realm-smtp
    encryptedData:
      SMTP_PASSWORD_DEAL_TRACKER_PROD: 
