# CA issuer: signs leaf certs (Authentik UI, LDAPS outpost, ...) with the root CA.
# Reference it from consumers via: cert-manager.io/cluster-issuer: {{ .Values.ca.caIssuerName }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ca.caIssuerName }}
  labels:
    app.kubernetes.io/name: internal-ca
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ca:
    secretName: {{ .Values.ca.rootSecretName }}
