apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: internal-ca
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/open-liontechsolution/toolsuite-platform-gitops
    path: apps/platform/internal-ca
    targetRevision: main
    helm:
      releaseName: internal-ca
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
