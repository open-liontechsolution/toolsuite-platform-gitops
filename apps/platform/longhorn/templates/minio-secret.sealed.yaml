# Credencial del BackupTarget de Longhorn (usuario `longhorn-backup` del MinIO
# que corre en la VM docker de sv2) y endpoint por el que se llega.
#
# Estaba fuera de Git: Secret creado a mano el 2025-10-09, sin ownerReferences ni
# tracking de ArgoCD. Era la unica pieza de Longhorn sin GitOps, y ademas la que
# tumbo los backups 49 dias (juanjocop/k3s-local-apps-manifests#7): las claves
# dejaron de ser validas el 2026-06-06 y no habia forma de saber cual era la
# buena ni de restaurarla.
#
# AWS_ENDPOINTS apunta al MinIO por LAN a proposito, no al hostname publico: los
# fallos de junio fueron 502 del proxy que lo fronta. Menos saltos en el camino
# de los backups.
#
# Al rotar la credencial hay que re-sellar (los SealedSecret van atados a
# namespace + nombre):
#   kubectl -n longhorn-system get secret minio-secret -o json \
#     | python3 -c 'import json,sys; s=json.load(sys.stdin); s["metadata"]={"name":"minio-secret","namespace":"longhorn-system"}; json.dump(s,sys.stdout)' \
#     | kubeseal --controller-namespace kube-system --controller-name sealed-secrets --format yaml
# El paso de python NO es opcional: sin el se sella tambien la anotacion
# last-applied-configuration, que lleva la credencial en claro.
#
# Si el Secret ya existe en el cluster (que es el caso de la adopcion, y sera el
# de cualquier rotacion hecha a mano antes de re-sellar), el controlador se niega:
#   "Resource minio-secret already exists and is not managed by SealedSecret"
# Hay que marcarlo como adoptable:
#   kubectl -n longhorn-system annotate secret minio-secret \
#     sealedsecrets.bitnami.com/managed=true --overwrite
# Y ojo: si el controlador ya habia desistido, no reintenta ("update suppressed,
# no changes in spec"). Hay que borrar el SealedSecret y dejar que ArgoCD lo
# recree -- borrar el CR NO borra el Secret.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-secret
  namespace: longhorn-system
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_ENDPOINTS: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: minio-secret
      namespace: longhorn-system
    type: Opaque
