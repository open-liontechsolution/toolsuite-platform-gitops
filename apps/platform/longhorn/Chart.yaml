apiVersion: v2
name: longhorn
description: Longhorn - Cloud-native distributed block storage for Kubernetes
type: application
version: 1.0.0
appVersion: "v1.7.1"

dependencies:
  - name: longhorn
    # Chart version equals the Longhorn release without the leading 'v'.
    # Pinned to the live release (v1.7.1) so the ArgoCD adoption diff is INERT.
    # Upgrades happen one minor at a time in later commits: 1.7 -> 1.8 -> 1.9 -> 1.10 -> 1.11 (target v1.11.2).
    version: "1.7.1"
    repository: https://charts.longhorn.io

maintainers:
  - name: Platform Team
    email: platform@example.com

keywords:
  - storage
  - block-storage
  - csi
  - distributed-storage
  - longhorn

home: https://longhorn.io
sources:
  - https://github.com/longhorn/longhorn
