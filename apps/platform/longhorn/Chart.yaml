apiVersion: v2
name: longhorn
description: Longhorn - Cloud-native distributed block storage for Kubernetes
type: application
version: 1.0.0
appVersion: "v1.11.2"

dependencies:
  - name: longhorn
    # Chart version equals the Longhorn release without the leading 'v'.
    # Upgrade chain (one minor per commit): 1.7.1 (adoption) -> 1.8.2 -> 1.9.2 -> 1.10.2 -> 1.11.2.
    # Hop 4 (final): 1.10.2 -> 1.11.2. This is the TARGET line — supports k8s
    # 1.32-1.35, leaving Longhorn comfortably in support on the cluster's k8s 1.33.
    # Longhorn enforces consecutive-minor upgrades; no downgrade from 1.10 onward.
    version: "1.11.2"
    repository: https://charts.longhorn.io

maintainers:
  - name: Platform Team
    email: platform@example.com

keywords:
  - storage
  - block-storage
  - csi
  - distributed-storage
  - longhorn

home: https://longhorn.io
sources:
  - https://github.com/longhorn/longhorn
