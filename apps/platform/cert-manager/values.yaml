# cert-manager configuration (wrapper over the official Jetstack chart)
#
# Values for the official Jetstack cert-manager chart (under the subchart key).
#
# `crds.enabled` installs the CRDs as part of the release; `crds.keep: true` adds
# the helm.sh/resource-policy: keep annotation so the CRDs survive an uninstall.
# This replaces the deprecated `installCRDs: true` (used during the v1.16.1
# adoption). The CRD annotation change is covered by ignoreDifferences in the
# ArgoCD Application, so it does not produce drift/churn.
cert-manager:
  crds:
    enabled: true
    keep: true
  featureGates: "ExperimentalGatewayAPISupport=true"
