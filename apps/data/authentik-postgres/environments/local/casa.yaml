# Authentik PostgreSQL - Home / Family environment ("casa")
# Namespace: data-casa
# Deployment: local k3s cluster with Longhorn storage
# Separate CNPG cluster from platform-postgres (Authentik-only).
# Note: "casa" is the home-use environment axis (not dev/qa/prod) - these are
# family tools running on-prem, not externally-facing project environments.

cluster:
  fullnameOverride: authentik-postgres-casa

  cluster:
    imageName: ghcr.io/cloudnative-pg/postgresql:16.4

    # Una sola instancia, a proposito.
    # Subir a 2 dejaria el segundo pod en Pending: la nodeAffinity de mas abajo
    # exige worker AND performance=high y `worker4` es el unico worker con esa
    # etiqueta. Ver la nota larga en apps/data/cnpg/environments/local/dev.yaml.
    # La recuperacion de este cluster es por backup, no por failover.
    instances: 1

    # Storage configuration for Longhorn
    storage:
      size: 20Gi
      storageClass: longhorn
    walStorage:
      storageClass: longhorn
      size: 1Gi

    # Modest resources for home use
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"

    # Node affinity: high-performance worker nodes only.
    # Both expressions are ANDed, so the instance lands on a node that is a
    # worker AND performance=high (control-plane master1 also carries
    # performance=high, so the worker label is required to exclude it).
    affinity:
      enablePodAntiAffinity: true
      topologyKey: kubernetes.io/hostname
      podAntiAffinityType: preferred
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/worker
                  operator: In
                  values:
                    - "true"
                - key: node.kubernetes.io/performance
                  operator: In
                  values:
                    - high

    # Environment labels
    additionalLabels:
      app.kubernetes.io/part-of: data-platform
      app.kubernetes.io/component: authentik-db
      environment: casa
      deployment: local

    # Bootstrap configuration
    bootstrap:
      initdb:
        database: authentik
        owner: authentik
        secret:
          name: authentik-postgres-app

    # Primary update strategy
    primaryUpdateStrategy: unsupervised

    # PostgreSQL tuning for a small home instance
    postgresql:
      parameters:
        max_connections: "100"
        shared_buffers: "128MB"
        effective_cache_size: "512MB"
        maintenance_work_mem: "32MB"
        work_mem: "1310kB"
        checkpoint_completion_target: "0.9"
        wal_buffers: "16MB"
        default_statistics_target: "100"
        random_page_cost: "1.1"
        effective_io_concurrency: "200"
        min_wal_size: "128MB"
        max_wal_size: "512MB"

  # Backup logico a MinIO. Forma completa en el values.yaml base.
  # Va atado a `backupSecret` de mas abajo: los dos flags se encienden a la vez y
  # en el mismo commit que el ciphertext; con backups.enabled y sin Secret, el
  # archivado de WAL falla.
  backups:
    enabled: true

# SealedSecret configuration for the "casa" environment.
# IMPORTANT: Replace the placeholders with real encrypted values before syncing:
#   echo -n "authentik"  | kubeseal --raw --from-file=/dev/stdin --namespace data-casa --name authentik-postgres-app --controller-name sealed-secrets --controller-namespace kube-system
#   echo -n "<db-pass>"  | kubeseal --raw --from-file=/dev/stdin --namespace data-casa --name authentik-postgres-app --controller-name sealed-secrets --controller-namespace kube-system
# The <db-pass> MUST match AUTHENTIK_POSTGRESQL__PASSWORD sealed in the Authentik release.
sealedSecret:
  enabled: true
  name: authentik-postgres-app
  encryptedData:
    username: ""  # REPLACE: sealed "authentik"
    password: ""  # REPLACE: sealed db password (same plaintext as Authentik's AUTHENTIK_POSTGRESQL__PASSWORD)

# Credencial S3 del backup a MinIO: usuario `cnpg-backup`, compartido con
# platform-postgres-dev. Los dos clusters escriben en el mismo bucket sin
# pisarse porque CNPG cuelga cada uno de su propio serverName
# (s3://cnpg-backup/authentik-postgres-casa/...).
#
# Es el MISMO plaintext que en apps/data/cnpg/environments/local/dev.yaml, pero
# el ciphertext es distinto y NO son intercambiables: un SealedSecret va atado a
# namespace + nombre, y este esta sellado contra data-casa.
#
# El bucket, la policy y el usuario los crea juanjocop/kxs-ansible#47; el
# plaintext vive en su vault cifrado. Rotacion en kxs-ansible/docs/MINIO_CREDS.md
# — hay que re-pegar los ciphertexts en los DOS ficheros.
backupSecret:
  enabled: true
  name: cnpg-backup-s3-creds
  encryptedData:
    accessKeyId: ""
    secretAccessKey: ""
