{{/*
Credencial S3 del barmanObjectStore (usuario `cnpg-backup` del MinIO que corre en
la VM docker de sv2, el mismo host que el BackupTarget de Longhorn).

Es la MISMA credencial que sella apps/data/cnpg, pero sellada aparte: un
SealedSecret va atado a namespace + nombre, y este vive en `data-casa`.

Por que no lo crea el subchart: `cluster/templates/backup-s3-creds.yaml` monta el
Secret a partir de `backups.s3.accessKey` / `backups.s3.secretKey`, que son las
claves EN CLARO en values. Por eso aqui va `backups.secret.create: false` y el
Secret lo pone este SealedSecret.

Los nombres de clave ACCESS_KEY_ID / ACCESS_SECRET_KEY no son elegibles: los
referencia `cluster/templates/_barman_object_store.tpl` del subchart.

Sellado:
  echo -n "<access-key>" | kubeseal --raw --from-file=/dev/stdin \
    --namespace data-casa --name cnpg-backup-s3-creds \
    --controller-name sealed-secrets --controller-namespace kube-system
*/}}
{{- if .Values.backupSecret.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.backupSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cluster.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  encryptedData:
    ACCESS_KEY_ID: {{ .Values.backupSecret.encryptedData.accessKeyId | quote }}
    ACCESS_SECRET_KEY: {{ .Values.backupSecret.encryptedData.secretAccessKey | quote }}
  template:
    metadata:
      name: {{ .Values.backupSecret.name }}
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/name: {{ include "cluster.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    type: Opaque
{{- end }}
