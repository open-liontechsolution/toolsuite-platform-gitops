# Local Development Environment Configuration
# Namespace: data-dev
# Deployment: local k3s cluster with Longhorn storage
#
# Bases de datos que aloja este cluster (a 2026-07-28): deal_tracker,
# deal_tracker_qa, keycloak_dev, tradingtool-dev, tradingtool-qa, platform.
# Las de QA y keycloak_dev estan PUBLICADAS en internet, de ahi que el backup
# logico de mas abajo no sea opcional.

# Values for the CloudNativePG cluster subchart
cluster:
  fullnameOverride: platform-postgres-dev

  cluster:

    # PostgreSQL image
    imageName: ghcr.io/cloudnative-pg/postgresql:16.4

    # Una sola instancia, a proposito.
    #
    # Subir a 2 hoy dejaria el segundo pod en Pending: la nodeAffinity de mas
    # abajo exige worker AND performance=high, y `worker4` es el UNICO worker con
    # esa etiqueta (worker3 es `low`, el resto no la llevan). Para tener HA de
    # verdad hay que etiquetar otro nodo desde kxs-ansible, o bajar la expresion
    # de performance a preferred. La politica acordada es 1 replica en dev/qa y
    # 2+ en prod, asi que esto se queda en 1 mientras no exista prod.
    #
    # Consecuencia asumida: perder worker4 se lleva por delante este Postgres
    # (y el de data-casa, que aterriza en el mismo nodo por la misma afinidad).
    # La recuperacion es por backup, no por failover.
    instances: 1

    # Storage configuration for Longhorn
    storage:
      size: 20Gi
      storageClass: longhorn
    walStorage:
      storageClass: longhorn
      size: 1Gi
    
    # Minimal resources for development
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
    
    # Node affinity: high-performance worker nodes only.
    # Both expressions are ANDed, so the instance lands on a node that is a
    # worker AND performance=high (control-plane master1 also carries
    # performance=high, so the worker label is required to exclude it).
    affinity:
      enablePodAntiAffinity: true
      topologyKey: kubernetes.io/hostname
      podAntiAffinityType: preferred
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/worker
                  operator: In
                  values:
                    - "true"
                - key: node.kubernetes.io/performance
                  operator: In
                  values:
                    - high
    
    # Environment labels
    additionalLabels:
      app.kubernetes.io/part-of: data-platform
      environment: dev
      deployment: local
    
    # Bootstrap configuration
    bootstrap:
      initdb:
        database: platform
        owner: platform
        secret:
          name: platform-postgres-app
    
    # Primary update strategy
    primaryUpdateStrategy: unsupervised
    
    # PostgreSQL tuning for dev
    postgresql:
      parameters:
        max_connections: "100"
        shared_buffers: "128MB"
        effective_cache_size: "512MB"
        maintenance_work_mem: "32MB"
        work_mem: "1310kB"
        checkpoint_completion_target: "0.9"
        wal_buffers: "16MB"
        default_statistics_target: "100"
        random_page_cost: "1.1"
        effective_io_concurrency: "200"
        min_wal_size: "128MB"
        max_wal_size: "512MB"

  # Backup logico a MinIO. Forma completa (endpoint, bucket, horario, retencion)
  # en el values.yaml base; aqui solo el interruptor.
  #
  # PENDIENTE: sigue en false porque falta crear el bucket `cnpg-backup` y su
  # usuario en el MinIO de sv2 y sellar la credencial (backupSecret, abajo).
  # Encender los dos flags A LA VEZ y en el mismo commit que el ciphertext: con
  # backups.enabled: true y sin Secret, el archivado de WAL falla y el Cluster se
  # queda con ContinuousArchiving en False.
  backups:
    enabled: false

# SealedSecret configuration for local dev
# IMPORTANT: Replace these placeholder values with actual encrypted secrets
# To encrypt a secret:
#   echo -n "your-value" | kubeseal --raw --from-file=/dev/stdin --namespace data-dev --name platform-postgres-app
sealedSecret:
  enabled: true
  name: platform-postgres-app
  encryptedData:
    # Replace with actual encrypted values using kubeseal
    username: ""
    password: ""

# Credencial S3 del backup a MinIO (usuario `cnpg-backup`).
#
# PENDIENTE, va de la mano de cluster.backups.enabled:
#   1. En el MinIO de sv2: crear el bucket `cnpg-backup` y un usuario con policy
#      limitada a ese bucket.
#   2. Sellar las dos mitades de la credencial CONTRA ESTE NAMESPACE:
#        echo -n "<access-key>" | kubeseal --raw --from-file=/dev/stdin \
#          --namespace data-dev --name cnpg-backup-s3-creds \
#          --controller-name sealed-secrets --controller-namespace kube-system
#        echo -n "<secret-key>" | kubeseal --raw --from-file=/dev/stdin \
#          --namespace data-dev --name cnpg-backup-s3-creds \
#          --controller-name sealed-secrets --controller-namespace kube-system
#   3. Pegar la salida abajo y poner los dos `enabled` a true.
# La MISMA credencial hay que sellarla otra vez para data-casa, en
# apps/data/authentik-postgres/environments/local/casa.yaml.
backupSecret:
  enabled: false
  name: cnpg-backup-s3-creds
  encryptedData:
    accessKeyId: ""      # REPLACE: sellado del access key contra data-dev
    secretAccessKey: ""  # REPLACE: sellado del secret key contra data-dev
