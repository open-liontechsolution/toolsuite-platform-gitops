# Local Development Environment Configuration
# Namespace: data-dev
# Deployment: local k3s cluster with Longhorn storage
#
# Bases de datos que aloja este cluster (a 2026-07-28): deal_tracker,
# deal_tracker_qa, keycloak_dev, tradingtool-dev, tradingtool-qa, platform.
# Las de QA y keycloak_dev estan PUBLICADAS en internet, de ahi que el backup
# logico de mas abajo no sea opcional.

# Values for the CloudNativePG cluster subchart
cluster:
  fullnameOverride: platform-postgres-dev

  cluster:

    # PostgreSQL image
    imageName: ghcr.io/cloudnative-pg/postgresql:16.4

    # Una sola instancia, a proposito.
    #
    # Subir a 2 hoy dejaria el segundo pod en Pending: la nodeAffinity de mas
    # abajo exige worker AND performance=high, y `worker4` es el UNICO worker con
    # esa etiqueta (worker3 es `low`, el resto no la llevan). Para tener HA de
    # verdad hay que etiquetar otro nodo desde kxs-ansible, o bajar la expresion
    # de performance a preferred. La politica acordada es 1 replica en dev/qa y
    # 2+ en prod, asi que esto se queda en 1 mientras no exista prod.
    #
    # Consecuencia asumida: perder worker4 se lleva por delante este Postgres
    # (y el de data-casa, que aterriza en el mismo nodo por la misma afinidad).
    # La recuperacion es por backup, no por failover.
    instances: 1

    # Storage configuration for Longhorn
    storage:
      size: 20Gi
      storageClass: longhorn
    walStorage:
      storageClass: longhorn
      size: 1Gi
    
    # Minimal resources for development
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
    
    # Node affinity: high-performance worker nodes only.
    # Both expressions are ANDed, so the instance lands on a node that is a
    # worker AND performance=high (control-plane master1 also carries
    # performance=high, so the worker label is required to exclude it).
    affinity:
      enablePodAntiAffinity: true
      topologyKey: kubernetes.io/hostname
      podAntiAffinityType: preferred
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/worker
                  operator: In
                  values:
                    - "true"
                - key: node.kubernetes.io/performance
                  operator: In
                  values:
                    - high
    
    # Environment labels
    additionalLabels:
      app.kubernetes.io/part-of: data-platform
      environment: dev
      deployment: local
    
    # Bootstrap configuration
    bootstrap:
      initdb:
        database: platform
        owner: platform
        secret:
          name: platform-postgres-app
    
    # Primary update strategy
    primaryUpdateStrategy: unsupervised
    
    # PostgreSQL tuning for dev
    postgresql:
      parameters:
        max_connections: "100"
        shared_buffers: "128MB"
        effective_cache_size: "512MB"
        maintenance_work_mem: "32MB"
        work_mem: "1310kB"
        checkpoint_completion_target: "0.9"
        wal_buffers: "16MB"
        default_statistics_target: "100"
        random_page_cost: "1.1"
        effective_io_concurrency: "200"
        min_wal_size: "128MB"
        max_wal_size: "512MB"

  # Backup logico a MinIO. Forma completa (endpoint, bucket, horario, retencion)
  # en el values.yaml base; aqui solo el interruptor.
  #
  # Va atado a `backupSecret` de mas abajo: los dos flags se encienden a la vez y
  # en el mismo commit que el ciphertext. Con backups.enabled: true y sin Secret,
  # el archivado de WAL falla y el Cluster se queda con ContinuousArchiving en
  # False.
  backups:
    enabled: true

# SealedSecret configuration for local dev
# IMPORTANT: Replace these placeholder values with actual encrypted secrets
# To encrypt a secret:
#   echo -n "your-value" | kubeseal --raw --from-file=/dev/stdin --namespace data-dev --name platform-postgres-app
sealedSecret:
  enabled: true
  name: platform-postgres-app
  encryptedData:
    # Replace with actual encrypted values using kubeseal
    username: ""
    password: ""

# Credencial S3 del backup a MinIO: usuario `cnpg-backup`, con policy acotada a
# ese bucket y nada mas (el rol comprueba con una prueba negativa que NO puede
# listar `longhorn-backup`).
#
# El bucket, la policy y el usuario los crea juanjocop/kxs-ansible#47
# (`roles/minio_creds` + `playbooks/minio_creds.yml`), y el plaintext vive en su
# vault cifrado (`vault_minio_cnpg_backup_secret_key`), no en la cabeza de nadie:
# es la leccion de `longhorn-backup`, que se creo a mano fuera de Git y costo 49
# dias de backups caidos (k3s-local-apps-manifests#7).
#
# El ciphertext de aqui esta atado a namespace + nombre (data-dev +
# cnpg-backup-s3-creds): NO es intercambiable con el de data-casa aunque el
# plaintext sea el mismo.
#
# Para rotar: nueva clave en el vault, re-ejecutar la playbook (detecta el
# desajuste y la reescribe en MinIO, y vuelve a sellar) y pegar los ciphertexts
# nuevos en los DOS ficheros. Procedimiento en kxs-ansible/docs/MINIO_CREDS.md.
# Mientras el paso de pegar no este sincronizado, los backups fallan con
# SignatureDoesNotMatch: hacerlo fuera del horario de los backups programados.
backupSecret:
  enabled: true
  name: cnpg-backup-s3-creds
  encryptedData:
    accessKeyId: ""
    secretAccessKey: ""
