# Local Development Environment Configuration
# Namespace: data-dev
# Deployment: local k3s cluster with Longhorn storage
#
# Bases de datos que aloja este cluster (a 2026-07-28): deal_tracker,
# deal_tracker_qa, keycloak_dev, tradingtool-dev, tradingtool-qa, platform.
# Las de QA y keycloak_dev estan PUBLICADAS en internet, de ahi que el backup
# logico de mas abajo no sea opcional.

# Values for the CloudNativePG cluster subchart
cluster:
  fullnameOverride: platform-postgres-dev

  cluster:

    # PostgreSQL image
    imageName: ghcr.io/cloudnative-pg/postgresql:16.4

    # Una sola instancia, a proposito.
    #
    # Subir a 2 hoy dejaria el segundo pod en Pending: la nodeAffinity de mas
    # abajo exige worker AND performance=high, y `worker4` es el UNICO worker con
    # esa etiqueta (worker3 es `low`, el resto no la llevan). Para tener HA de
    # verdad hay que etiquetar otro nodo desde kxs-ansible, o bajar la expresion
    # de performance a preferred. La politica acordada es 1 replica en dev/qa y
    # 2+ en prod, asi que esto se queda en 1 mientras no exista prod.
    #
    # Consecuencia asumida: perder worker4 se lleva por delante este Postgres
    # (y el de data-casa, que aterriza en el mismo nodo por la misma afinidad).
    # La recuperacion es por backup, no por failover.
    instances: 1

    # Storage configuration for Longhorn
    storage:
      size: 20Gi
      storageClass: longhorn
    walStorage:
      storageClass: longhorn
      size: 1Gi
    
    # Minimal resources for development
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
    
    # Node affinity: high-performance worker nodes only.
    # Both expressions are ANDed, so the instance lands on a node that is a
    # worker AND performance=high (control-plane master1 also carries
    # performance=high, so the worker label is required to exclude it).
    affinity:
      enablePodAntiAffinity: true
      topologyKey: kubernetes.io/hostname
      podAntiAffinityType: preferred
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/worker
                  operator: In
                  values:
                    - "true"
                - key: node.kubernetes.io/performance
                  operator: In
                  values:
                    - high
    
    # Environment labels
    additionalLabels:
      app.kubernetes.io/part-of: data-platform
      environment: dev
      deployment: local
    
    # Bootstrap configuration
    bootstrap:
      initdb:
        database: platform
        owner: platform
        secret:
          name: platform-postgres-app

    # Roles gestionados por el operador (`.spec.managed.roles` del Cluster).
    #
    # VACIO desde la #71: el unico que habia, `deal_tracker_prod`, se fue con su
    # base al cluster general de produccion (`apps/data/platform-postgres`, ns
    # `data-prod`). Aqui ya no queda nada declarado.
    #
    # OJO con el anidamiento cuando vuelva a haber alguno: esto es
    # `cluster.cluster.roles`, no `cluster.managed.roles`, que es donde uno lo
    # pondria por intuicion y donde no lo lee nadie.
    #
    # Los cinco roles de aplicacion que existen en este Postgres (deal_tracker,
    # deal_tracker_qa, keycloak_dev, tradingtool-dev-user, tradingtool-qa-user)
    # NO estan aqui a proposito: son de antes, creados a mano, y declararlos con
    # `passwordSecret` les resetearia la contraseña de golpe. Se adoptan de uno
    # en uno, en su propia issue. Y ojo: al irse `deal_tracker_prod`, este
    # cluster se queda SIN NINGUN role declarado, o sea que el reparto entero de
    # sus bases vuelve a estar fuera de git. Ver README.md.
    roles:
      - name: cocina
        ensure: present
        comment: "cocina-familiar: la despensa de casa (juanjocop/cocina-familiar)"
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: cocina-familiar-db
        # `inherit` y `connectionLimit` son los DEFAULTS DEL API SERVER y aun asi van
        # escritos a mano, igual que en el cluster de prod: Argo posee
        # `spec.managed.roles` como lista ATOMICA, asi que lo que el operador anada
        # dentro cuenta como diferencia y la Application se queda OutOfSync para
        # siempre. Sin estas dos lineas el sync sale Succeeded y el Cluster no.
        inherit: true
        connectionLimit: -1

      # Los dos entornos de pruebas de helit (juanjocop/cocina-familiar#17). Comparten Postgres
      # con `cocina`, que es la despensa de verdad, y no pasa nada: son roles distintos con bases
      # distintas. Lo que NO comparten es la contrasena — un token de pruebas que abriera la
      # despensa de casa seria justo lo que estos entornos existen para evitar.
      - name: helit_dev
        ensure: present
        comment: "helit dev: entorno desechable, datos falsos (juanjocop/cocina-familiar#17)"
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: helit-dev-db
        # Mismo motivo que en `cocina`: `spec.managed.roles` es una lista ATOMICA, asi que sin
        # estas dos lineas el operador anade los defaults, eso cuenta como diferencia, y la
        # Application se queda OutOfSync para siempre con el sync en Succeeded.
        inherit: true
        connectionLimit: -1
      - name: helit_qa
        ensure: present
        comment: "helit qa: la puerta a produccion, datos falsos y auth encendida (juanjocop/cocina-familiar#17)"
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: helit-qa-db
        # Mismo motivo que en `cocina`: `spec.managed.roles` es una lista ATOMICA, asi que sin
        # estas dos lineas el operador anade los defaults, eso cuenta como diferencia, y la
        # Application se queda OutOfSync para siempre con el sync en Succeeded.
        inherit: true
        connectionLimit: -1

    # Primary update strategy
    primaryUpdateStrategy: unsupervised
    
    # PostgreSQL tuning for dev
    postgresql:
      parameters:
        max_connections: "100"
        shared_buffers: "128MB"
        effective_cache_size: "512MB"
        maintenance_work_mem: "32MB"
        work_mem: "1310kB"
        checkpoint_completion_target: "0.9"
        wal_buffers: "16MB"
        default_statistics_target: "100"
        random_page_cost: "1.1"
        effective_io_concurrency: "200"
        min_wal_size: "128MB"
        max_wal_size: "512MB"

  # Bases de datos declaradas, via el CRD `Database` (CNPG >= 1.25).
  #
  # VACIO desde la #71: `deal_tracker_prod` era la unica, y se fue al cluster
  # general de produccion. Con `databaseReclaimPolicy: retain` quitarla de aqui
  # NO dropea nada — la copia vieja sigue en este Postgres, intacta, hasta que
  # alguien la borre a mano.
  #
  # Las seis que quedan (platform del initdb, deal_tracker, deal_tracker_qa,
  # keycloak_dev, tradingtool-dev, tradingtool-qa) se crearon a mano y no viven
  # en ningun repositorio: reconstruir este Postgres desde cero es hoy recrearlas
  # a mano y acordarse de quien era dueño de cada una. Ver README.md.
  databases:
    - name: cocina
      owner: cocina
      # EL NOMBRE DE LA BASE Y EL DEL ROLE SON CONTRATO con k3s-local-apps-manifests:
      # van dentro del `DATABASE_URL` sellado de `cocina-familiar/overlays/dev`.
      # Cambiarlos aqui deja de validar alli, y el fallo aparece como un pod que no
      # arranca, lejos de la causa.
      #
      # `retain` explicito aunque sea el default del CRD: con `delete`, borrar este
      # objeto Database DROPEA la base entera — y aqui eso es el inventario de la
      # despensa de casa.
      databaseReclaimPolicy: retain

    # Las dos de helit. Mismo contrato que arriba: el nombre de la base y el del role viajan
    # dentro del `DATABASE_URL` sellado de `helit/overlays/{dev,qa}` en k3s-local-apps-manifests,
    # asi que cambiarlos aqui se ve alli como un pod que no arranca, lejos de la causa.
    - name: helit_dev
      owner: helit_dev
      # `retain` explicito aunque sea el default del CRD, igual que en `cocina`. Aqui no hay
      # inventario de nadie, pero el dia que se retire este entorno conviene que borrar el objeto
      # `Database` no dropee la base sin avisar.
      databaseReclaimPolicy: retain
    - name: helit_qa
      owner: helit_qa
      databaseReclaimPolicy: retain

  # Backup logico a MinIO. Forma completa (endpoint, bucket, horario, retencion)
  # en el values.yaml base; aqui solo el interruptor.
  #
  # Va atado a `backupSecret` de mas abajo: los dos flags se encienden a la vez y
  # en el mismo commit que el ciphertext. Con backups.enabled: true y sin Secret,
  # el archivado de WAL falla y el Cluster se queda con ContinuousArchiving en
  # False.
  backups:
    enabled: true

# SealedSecret configuration for local dev
# IMPORTANT: Replace these placeholder values with actual encrypted secrets
# To encrypt a secret:
#   echo -n "your-value" | kubeseal --raw --from-file=/dev/stdin --namespace data-dev --name platform-postgres-app
sealedSecret:
  enabled: true
  name: platform-postgres-app
  encryptedData:
    # Replace with actual encrypted values using kubeseal
    username: ""
    password: ""

# Credencial S3 del backup a MinIO: usuario `cnpg-backup`, con policy acotada a
# ese bucket y nada mas (el rol comprueba con una prueba negativa que NO puede
# listar `longhorn-backup`).
#
# El bucket, la policy y el usuario los crea juanjocop/kxs-ansible#47
# (`roles/minio_creds` + `playbooks/minio_creds.yml`), y el plaintext vive en su
# vault cifrado (`vault_minio_cnpg_backup_secret_key`), no en la cabeza de nadie:
# es la leccion de `longhorn-backup`, que se creo a mano fuera de Git y costo 49
# dias de backups caidos (k3s-local-apps-manifests#7).
#
# El ciphertext de aqui esta atado a namespace + nombre (data-dev +
# cnpg-backup-s3-creds): NO es intercambiable con el de data-casa aunque el
# plaintext sea el mismo.
#
# Para rotar: nueva clave en el vault, re-ejecutar la playbook (detecta el
# desajuste y la reescribe en MinIO, y vuelve a sellar) y pegar los ciphertexts
# nuevos en los DOS ficheros. Procedimiento en kxs-ansible/docs/MINIO_CREDS.md.
# Mientras el paso de pegar no este sincronizado, los backups fallan con
# SignatureDoesNotMatch: hacerlo fuera del horario de los backups programados.
backupSecret:
  enabled: true
  name: cnpg-backup-s3-creds
  encryptedData:
    accessKeyId: ""
    secretAccessKey: ""

# Contraseñas de los roles de `cluster.cluster.roles`, una por role. Forma
# completa y el porque del mapa, en templates/role-sealedsecret.yaml.
#
# VACIO desde la #71: el ciphertext de `deal-tracker-prod-db` se fue con el role
# al cluster general de produccion, re-sellado alli para el namespace `data-prod`
# (el sellado va atado a namespace + nombre, asi que el de aqui no valia).
#
# El Secret `deal-tracker-prod-db` que quede en `data-dev` es huerfano: no lo usa
# ningun role declarado. Se puede borrar a mano cuando se retire la copia vieja
# de la base.
# Contrasena del role `cocina`. Generada al azar el 31/08/2026 y sellada sin pasar
# por disco: el texto plano no existe en ningun sitio, y no hace falta — el unico que
# la usa es el `DATABASE_URL` de `cocina-familiar/overlays/dev`, que se sello con la
# misma contrasena en la misma pasada.
#
# Rotarla obliga a resellar en LOS DOS REPOS Y EN ESTE ORDEN: primero aqui, que es
# quien manda sobre el role, y despues el `DATABASE_URL` de alla. Al reves deja la
# aplicacion fuera hasta que el operador reconcilie — medido el 08/08/2026 con prod
# de deal-tracker, 40 minutos en CrashLoopBackOff.
#
# El plaintext de `username` es literalmente el nombre del role: CNPG lo compara, y
# si no cuadra ignora la contrasena sin avisar.
roleSecrets:
  cocina-familiar-db:
    username: ""
    password: ""

  # Contrasenas de los roles `helit_dev` y `helit_qa`. Generadas al azar el 03/09/2026 y selladas
  # sin pasar por disco, en la MISMA pasada que los `DATABASE_URL` de `helit/overlays/{dev,qa}`
  # en k3s-local-apps-manifests: el texto plano no existe en ningun sitio, y no hace falta.
  #
  # Rotarlas obliga a resellar en LOS DOS REPOS Y EN ESTE ORDEN, igual que la de `cocina`:
  # primero aqui, que es quien manda sobre el role, y despues el `DATABASE_URL` de alla.
  helit-dev-db:
    username: ""
    password: ""
  helit-qa-db:
    username: ""
    password: ""
