cluster:
  mode: standalone
  type: postgresql

  nameOverride: ""
  fullnameOverride: ""

  cluster:
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:16.4

    storage:
      size: 20Gi
      storageClass: ""

    walStorage:
      enabled: true
      size: 1Gi
      storageClass: ""

    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "4000m"
        memory: "8Gi"

    primaryUpdateStrategy: unsupervised

    affinity:
      topologyKey: kubernetes.io/hostname

    # Monitoring: el objeto PodMonitor NO es nuestro.
    #
    # Lo declara k3s-local-apps-manifests en `prometheus/cnpg/podmonitor.yaml`
    # (ns `monitoring`, con namespaceSelector sobre data-dev y data-casa), y esta
    # verificado en vivo: los dos pods se scrapean. Se hizo alli porque el
    # exporter ya servia metricas pese a tener esto apagado — `.spec.monitoring`
    # del Cluster no depende de este flag, el 9187 devuelve 518 series `cnpg_` —
    # asi que lo unico que faltaba era quien declarase el objeto.
    # Encender `podMonitor` aqui crearia un SEGUNDO PodMonitor y el scrape saldria
    # duplicado. Si algun dia queremos ser dueños del objeto, primero se borra el
    # del otro repo y luego se enciende esto; en ese orden.
    #
    # `prometheusRule` tampoco sirve: las reglas que genera el chart no llevan la
    # etiqueta `prometheus: prometheus-persistant` y el `ruleSelector` de nuestro
    # Prometheus las ignoraria en silencio. Las reglas estan escritas a medida en
    # `prometheus/prometheus/rules-cnpg.yaml` del repo de manifiestos.
    #
    # Los dos sub-flags van a false explicitamente, y no solo el master switch:
    # asi encender `monitoring.enabled` (p.ej. para meter customQueries) no
    # arrastra de rebote el PodMonitor duplicado.
    monitoring:
      enabled: false
      podMonitor:
        enabled: false
      prometheusRule:
        enabled: false

    initdb:
      database: platform
      owner: platform
      secret:
        name: platform-postgres-app

    # Roles gestionados por el operador (`.spec.managed.roles` del Cluster).
    #
    # OJO con el anidamiento: esto es `cluster.cluster.roles`, no
    # `cluster.managed.roles`. El bloque `managed:` lo construye el subchart en
    # `cluster/templates/cluster.yaml`; nosotros solo le damos la lista. Ponerlo
    # un nivel mas arriba es el fallo silencioso de siempre: Helm lo acepta, el
    # subchart lo ignora y el role no se crea.
    #
    # La contraseña de cada role va aparte, en `roleSecrets` (mas abajo), porque
    # tiene que ser un Secret de tipo basic-auth.
    #
    # ATENCION al declarar un role que YA EXISTE en el cluster: darle un
    # `passwordSecret` hace que CNPG le RESETEE la contraseña a la del secret. Si
    # el valor no es exactamente el que usa hoy, la aplicacion que lo use se cae.
    # Los roles preexistentes se adoptan de uno en uno y con verificacion entre
    # medias, nunca en lote.
    roles: []

  # Bases de datos declaradas, via el CRD `Database` (CNPG >= 1.25). Las
  # renderiza `cluster/templates/databases.yaml` del subchart; la lista vacia es
  # el gate.
  #
  # Esto NO es lo mismo que `cluster.cluster.initdb`: initdb solo corre al
  # crearse el cluster y da UNA base (`platform`). Todo lo demas que vive en este
  # Postgres se creaba a mano, y por eso el reparto de bases y dueños no estaba
  # escrito en ningun sitio — los datos vuelven en el backup fisico, el reparto
  # no. Ver #53.
  #
  # `databaseReclaimPolicy` se escribe explicito aunque `retain` sea el default
  # del CRD: con `delete`, borrar el objeto Database DROPea la base.
  databases: []

  # Backup logico del operator (barmanObjectStore -> MinIO).
  #
  # Las 3 replicas de Longhorn protegen de perder un disco, NO de un `DROP TABLE`
  # ni de una corrupcion. Este es el unico backup real de los datos.
  #
  # `enabled` se enciende en el values de entorno, junto con `backupSecret`: sin
  # la credencial sellada el archivado de WAL falla y el Cluster se queda con la
  # condicion ContinuousArchiving en False.
  #
  # Nota de caducidad: el barmanObjectStore in-tree esta deprecado desde CNPG 1.26
  # y desaparece en 1.31 (vamos por 1.28.1). La migracion al plugin barman-cloud
  # (CNPG-I) va en issue aparte; implica subir el chart `cluster` 0.6.1 -> 0.8.x y
  # traducir este bloque a un CR ObjectStore.
  backups:
    enabled: false
    provider: s3

    # MinIO por LAN, igual que el BackupTarget de Longhorn: los fallos de junio
    # (k3s-local-apps-manifests#7) fueron 502 del proxy que lo fronta. Menos
    # saltos en el camino de los backups.
    # La VM del MinIO estuvo en la .100 hasta 2026-08-09: un repetidor Xiaomi
    # tenia esa IP guardada en su config (no la pide por DHCP, no hay forma de
    # desalojarlo) y el archivado de WAL fallaba a rachas segun quien ganaba el
    # ARP -- alerta CNPGWALArchiveFailing, kxs-ansible#54/#55.
    endpointURL: "http://192.168.50.240:9000"

    # Bucket dedicado, distinto del `longhorn-backup`: credencial separada y
    # retencion independiente. CNPG cuelga cada cluster de su propio serverName
    # (= nombre del Cluster), asi que los dos clusters comparten bucket sin
    # pisarse: s3://cnpg-backup/platform-postgres-dev/...
    destinationPath: "s3://cnpg-backup"

    secret:
      # El Secret lo pone templates/backup-s3-sealedsecret.yaml. El del subchart
      # exigiria las claves en claro en values (backups.s3.accessKey).
      create: false
      name: cnpg-backup-s3-creds

    wal:
      compression: gzip
      # Sin SSE: el MinIO de sv2 no lo tiene configurado y el AES256 que trae el
      # chart por defecto haria fallar cada PUT del archivado.
      encryption: ""
      maxParallel: 1
    data:
      compression: gzip
      encryption: ""
      jobs: 2

    retentionPolicy: "30d"

    scheduledBackups:
      - name: daily-backup
        # Formato CNPG de 6 campos (el primero son segundos): 01:30 UTC. Se deja
        # por delante del prod-backup de Longhorn (02:15) para no solapar el
        # ancho de banda hacia el mismo host.
        schedule: "0 30 1 * * *"
        backupOwnerReference: self
        method: barmanObjectStore


# SealedSecret configuration
# This creates a SealedSecret that will be unsealed by the sealed-secrets controller
# The encrypted values must be obtained using kubeseal
sealedSecret:
  enabled: false  # Set to true in environment-specific values
  name: platform-postgres-app
  encryptedData:
    # These values must be encrypted using kubeseal
    # Example: echo -n "platform" | kubeseal --raw --from-file=/dev/stdin --namespace data-dev --name platform-postgres-app
    username: ""  # Encrypted username (set in environment values)
    password: ""  # Encrypted password (set in environment values)

# Credencial S3 del barmanObjectStore de arriba (usuario `cnpg-backup` del MinIO).
# Ver templates/backup-s3-sealedsecret.yaml. Se enciende en el values de entorno,
# a la vez que cluster.backups.enabled.
backupSecret:
  enabled: false
  name: cnpg-backup-s3-creds
  encryptedData:
    # echo -n "<access-key>" | kubeseal --raw --from-file=/dev/stdin --namespace data-dev --name cnpg-backup-s3-creds --controller-name sealed-secrets --controller-namespace kube-system
    accessKeyId: ""
    secretAccessKey: ""

# Contraseñas de los roles de `cluster.cluster.roles`, una por role.
# Ver templates/role-sealedsecret.yaml, que explica por que estos van por mapa y
# no en un bloque propio como los dos de arriba.
#
# La clave del mapa es el NOMBRE DEL SECRET, y el mapa vacio es el gate. El
# plaintext de `username` tiene que ser exactamente el nombre del role: CNPG lo
# compara, y si no cuadra ignora la contraseña sin avisar.
#
#   roleSecrets:
#     deal-tracker-prod-db:
#       username: "<ciphertext de: deal_tracker_prod>"
#       password: "<ciphertext de la contraseña>"
roleSecrets: {}
