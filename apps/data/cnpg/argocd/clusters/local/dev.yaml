apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster-local-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tools
  
  source:
    repoURL: https://github.com/open-liontechsolution/toolsuite-platform-gitops
    path: apps/data/cnpg
    targetRevision: main
    helm:
      releaseName: platform-postgres-dev
      valueFiles:
        - values.yaml
        - environments/local/dev.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: data-dev
  
  syncPolicy:
    # SIN `automated`, a proposito. No es un olvido.
    #
    # Este cluster aloja las bases de datos de las que dependen varias
    # aplicaciones publicadas (deal_tracker_qa, keycloak_dev,
    # tradingtool-{dev,qa}). Un auto-sync con prune+selfHeal desplegaria
    # cualquier error del repo directamente contra ellas, sin nadie mirando.
    # La ventana de revision manual es deliberada.
    #
    # El sync se lanza a mano tras revisar el diff:
    #   argocd app diff cnpg-cluster-local-dev --local apps/data/cnpg
    #   argocd app sync cnpg-cluster-local-dev
    # o, sin la CLI:
    #   kubectl -n argocd patch app cnpg-cluster-local-dev --type merge \
    #     -p '{"operation":{"sync":{"syncOptions":["CreateNamespace=true","ServerSideApply=true"]}}}'
    #
    # LAS syncOptions SE REPITEN AHI A PROPOSITO, aunque esten declaradas justo debajo:
    # una operacion lanzada a mano NO hereda `spec.syncPolicy.syncOptions`. Argo
    # sincroniza con las de la propia operacion, asi que un `{"sync":{}}` a secas las
    # pierde LAS DOS y no lo dice. Con `CreateNamespace` perdido, el sync falla con
    # `namespaces "..." not found`; con `ServerSideApply` perdido no falla nada — se
    # aplica del otro modo y ya esta. Medido el 22/08/2026 desplegando la #62: la
    # operacion quedo registrada como {"sync": {}} con las dos opciones en el spec.
    #
    # `authentik-postgres-local-casa` SI va en automatico: es el auth de casa,
    # no tiene dependientes externos y el coste de un rollback es otro.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Health assessment for CNPG Cluster
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
      #  - /spec/instances
        - /status
    # Preventivo, en espejo del de arriba: el operador escribe `.status` del
    # Database (`applied`, `observedGeneration`, `message`).
    #
    # Honestidad sobre esta regla: MEDIDO el 08-08-2026, el Database salio Synced
    # SIN ella — Argo no estaba diffeando su status. Se deja igualmente porque el
    # coste es cero y el fallo que evita es caro: aqui el sync es manual, asi que
    # un OutOfSync cronico esconde los cambios que si hay que mirar. Si algun dia
    # estorba, se quita sin miedo.
    - group: postgresql.cnpg.io
      kind: Database
      jsonPointers:
        - /status
