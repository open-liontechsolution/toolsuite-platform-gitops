{{/*
Contraseñas de los roles declarados en `cluster.cluster.roles` (que el subchart
mete en el bloque `managed` del Cluster). Uno por role.

Por que no vale la plantilla `sealedsecret.yaml` de al lado: CNPG exige que el
`passwordSecret` de un role sea de tipo `kubernetes.io/basic-auth`, y que el
`username` de dentro sea EXACTAMENTE el nombre del role. Las otras dos
plantillas de este chart emiten `Opaque`, que aqui no sirve. Y el fallo es
silencioso: el Secret se desella, el Cluster sincroniza, y el role se queda sin
contraseña.

La etiqueta `cnpg.io/reload: "true"` es lo que hace que una rotacion se aplique
sin reiniciar el pod.

Va por MAPA, y no con un bloque por secret como las otras dos, porque queda
pendiente declarar las seis bases que ya existen en este cluster —hoy creadas a
mano y sin rastro en ningun repositorio, ver #53— y eso serian seis bloques y
seis plantillas casi iguales. La clave del mapa es el nombre del Secret, y el
mapa vacio es el gate.

Sellado (va atado a namespace + nombre, hay que repetirlo por entorno):
  printf %s "<valor>" | kubeseal --raw --from-file=/dev/stdin \
    --namespace data-dev --name mi-app-db \
    --controller-name sealed-secrets --controller-namespace kube-system
*/}}
{{- range $name, $secret := .Values.roleSecrets }}
{{- if or (empty $secret.username) (empty $secret.password) }}
{{- fail (printf "roleSecrets.%s: falta el ciphertext de `username` y/o de `password`. Se para aqui a proposito: un secret a medias no rompe el despliegue, deja el role sin poder entrar y el fallo aparece en la aplicacion, lejos de la causa." $name) }}
{{- end }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cluster.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  encryptedData:
    username: {{ $secret.username | quote }}
    password: {{ $secret.password | quote }}
  template:
    metadata:
      name: {{ $name }}
      namespace: {{ $.Release.Namespace }}
      labels:
        app.kubernetes.io/name: {{ include "cluster.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        cnpg.io/reload: "true"
    type: kubernetes.io/basic-auth
{{- end }}
