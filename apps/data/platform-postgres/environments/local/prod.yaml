# platform-postgres - cluster CNPG GENERAL del tier de PRODUCCION (issue #71)
# Namespace: data-prod
# Deployment: k3s local con almacenamiento Longhorn
#
# Sustituye a `keycloak-postgres-prod`, que era el mismo cluster con otro nombre y un
# solo inquilino. Aqui viven las DOS bases de produccion:
#   keycloak_prod      - el IdP (llego con la #62), la crea el initdb
#   deal_tracker_prod  - los datos de la aplicacion (llego con la #71 desde
#                        platform-postgres-dev, ns data-dev), declarada abajo

cluster:
  fullnameOverride: platform-postgres-prod

  cluster:
    imageName: ghcr.io/cloudnative-pg/postgresql:16.4

    # Una sola instancia, a proposito.
    # Subir a 2 dejaria el segundo pod en Pending: la nodeAffinity de mas abajo exige
    # worker AND performance=high y `worker4` es el unico worker con esa etiqueta. Ver
    # la nota larga en apps/data/cnpg/environments/local/dev.yaml.
    # La recuperacion de este cluster es por backup, no por failover.
    instances: 1

    # 20Gi, no los 10Gi que llevaba cuando solo alojaba el IdP. El que crece aqui es
    # `deal_tracker_prod`: 289 MB medidos el 22/08/2026, de los cuales 110 MB son
    # `variant` y 103 MB `price_history`, y el historico de precios solo suma —una
    # pasada diaria de diez scrapers—. `keycloak_prod` son 15 MB y no crece con los
    # datos de la aplicacion. Es el mismo tamano que tiene platform-postgres-dev, que
    # con seis bases dentro va al 2%.
    storage:
      size: 20Gi
      storageClass: longhorn
    walStorage:
      storageClass: longhorn
      size: 1Gi

    # MEDIDO, no copiado: estos son los mismos limites con los que platform-postgres-dev
    # sirve hoy SEIS bases (dev, qa y la propia produccion) sin apretar. Este cluster se
    # lleva una de esas seis mas el IdP, o sea estrictamente menos carga. Si algun dia
    # entra un tercer inquilino, se mide antes de subirlos.
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"

    # Node affinity: solo workers de alto rendimiento.
    # Las dos expresiones van ANDed, asi que la instancia cae en un nodo que es worker
    # AND performance=high (el control-plane master1 tambien lleva performance=high,
    # por eso la etiqueta de worker es obligatoria para excluirlo).
    affinity:
      enablePodAntiAffinity: true
      topologyKey: kubernetes.io/hostname
      podAntiAffinityType: preferred
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/worker
                  operator: In
                  values:
                    - "true"
                - key: node.kubernetes.io/performance
                  operator: In
                  values:
                    - high

    additionalLabels:
      app.kubernetes.io/part-of: data-platform
      app.kubernetes.io/component: platform-db
      environment: prod
      deployment: local

    # OJO CON LA RUTA: es `cluster.cluster.initdb`, NO `cluster.cluster.bootstrap.initdb`.
    # El subchart arma el bloque `bootstrap:` el solo a partir de `initdb`, asi que un
    # `bootstrap:` escrito a mano aqui NO SE LEE — Helm lo acepta, el render sale con los
    # valores de otro sitio y no avisa nadie. Comprobado: forzando
    # `cluster.cluster.bootstrap.initdb.database=ZZZ` el Cluster renderiza igual, y
    # forzando `cluster.cluster.initdb.database=ZZZ` cambia. Ver #70.
    #
    # Que la base del initdb sea la del IdP y no una neutra es deliberado: sus
    # credenciales ya estaban selladas dos veces cuando se hizo el traslado, y
    # reaprovecharlas dejo el movimiento del Keycloak en un solo valor a re-sellar
    # (`KC_DB_URL_HOST`). El porque largo, en el values.yaml base.
    initdb:
      database: keycloak_prod
      owner: keycloak_prod
      secret:
        name: keycloak-postgres-app

      # SIN ESTO KEYCLOAK NO ARRANCA. Su ConfigMap fija `KC_DB_SCHEMA: keycloak`, y
      # Keycloak espera encontrar ese schema: no lo crea. Liquibase muere con
      # `ERROR: schema "keycloak" does not exist` al intentar crear `databasechangelog`,
      # y el pod entra en bucle de reinicio. Costo 9 reinicios al estrenar la #62.
      #
      # postInitApplicationSQL corre UNA VEZ, en el bootstrap y contra la base de la
      # aplicacion. Anadirlo a un cluster ya arrancado no lo ejecuta: si hiciera falta
      # cambiarlo, hay que recrear el cluster.
      #
      # Se queda aunque el traslado de la #71 restaure `keycloak_prod` desde un volcado
      # que ya trae el schema: es lo que hace que reconstruir esta base desde cero
      # reproduzca una que arranca.
      postInitApplicationSQL:
        - CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION keycloak_prod

    # Role del segundo inquilino. `cluster.cluster.roles`, no `cluster.managed.roles`:
    # el bloque `managed:` lo construye el subchart.
    #
    # `inherit` y `connectionLimit` son los DEFAULTS DEL API SERVER y aun asi van
    # escritos a mano. Argo posee `spec.managed.roles` como lista ATOMICA, asi que lo
    # que el operador anada dentro cuenta como diferencia y la Application se queda
    # OutOfSync para siempre. Medido en la #55: sin estas dos lineas el sync sale
    # Succeeded y el Cluster sigue OutOfSync.
    roles:
      - name: deal_tracker_prod
        ensure: present
        comment: "deal-tracker produccion (Liontech-Solution/deal-tracker#267)"
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: deal-tracker-prod-db
        inherit: true
        connectionLimit: -1

    primaryUpdateStrategy: unsupervised

    # Tuning para una instancia pequena. Sin cambios respecto a los otros dos clusters
    # del repo: la carga que entra con deal_tracker_prod es una pasada diaria de
    # scrapers, no concurrencia.
    postgresql:
      parameters:
        max_connections: "100"
        shared_buffers: "128MB"
        effective_cache_size: "512MB"
        maintenance_work_mem: "32MB"
        work_mem: "1310kB"
        checkpoint_completion_target: "0.9"
        wal_buffers: "16MB"
        default_statistics_target: "100"
        random_page_cost: "1.1"
        effective_io_concurrency: "200"
        min_wal_size: "128MB"
        max_wal_size: "512MB"

  # Base del segundo inquilino, via el CRD `Database`. Hermana de `cluster.cluster`,
  # NO dentro de el.
  #
  # EL NOMBRE DE LA BASE Y EL DEL ROLE SON CONTRATO con k3s-local-apps-manifests: van
  # dentro del `DATABASE_URL` sellado de `deal-tracker/overlays/prod`. Cambiarlos aqui
  # deja de validar alli.
  #
  # `retain` explicito aunque sea el default del CRD: con `delete`, borrar el objeto
  # Database DROPea la base. El objeto se llamara `platform-postgres-prod-deal-tracker-prod`
  # (el prefijo lo impone el subchart); lo que importa es `spec.name`.
  databases:
    - name: deal_tracker_prod
      owner: deal_tracker_prod
      databaseReclaimPolicy: retain

  # Backup logico a MinIO. Forma completa en el values.yaml base.
  # Va atado a la credencial S3 de mas abajo: con `backups.enabled` y sin Secret, el
  # archivado de WAL falla y el cluster arranca igual — el fallo no se ve hasta el dia
  # que hace falta el backup.
  backups:
    enabled: true

# Credenciales del role `keycloak_prod` (la base del initdb). Los ciphertexts son los
# MISMOS que usaba apps/data/keycloak-postgres y siguen siendo validos sin re-sellar:
# el sellado va atado a namespace + nombre, y ninguno de los dos cambia (data-prod,
# keycloak-postgres-app). El nombre del Secret conserva el prefijo `keycloak-` a
# proposito: describe a su inquilino, no al cluster.
#
# El mismo plaintext del password esta sellado tambien contra `security-prod` en
# apps/security/keycloak/environments/local/prod.yaml, bajo `KC_DB_PASSWORD`. Si se
# rota, se rotan LOS DOS en el mismo commit.
#
# Encendido al retirar apps/data/keycloak-postgres (#71). Estuvo en `false` mientras
# los dos charts convivieron: aquel declaraba este mismo objeto, y dos Applications
# sobre el mismo recurso es un SharedResourceWarning en Argo.
sealedSecret:
  enabled: true
  name: keycloak-postgres-app
  encryptedData:
    username: ""
    password: ""

# Credencial S3 del barmanObjectStore.
#
# Encendido al retirar apps/data/keycloak-postgres (#71), por el mismo motivo que
# `sealedSecret` de arriba.
#
# EL ORDEN IMPORTA Y NO SE VE: hay que sincronizar ESTA Application antes de borrar la
# vieja. El SealedSecret es el dueño del Secret, asi que si se va primero el viejo, el
# Secret se lo lleva por delante y el archivado de WAL empieza a fallar en silencio.
backupSecret:
  enabled: true
  name: cnpg-backup-s3-creds
  encryptedData:
    accessKeyId: ""
    secretAccessKey: ""

# Contrasena del role `deal_tracker_prod`. Es la MISMA que usaba en
# platform-postgres-dev, re-sellada para este namespace (23/08/2026): reutilizarla en
# vez de generar una nueva hace que la vuelta atras sea re-sellar el host viejo en
# `DATABASE_URL` y nada mas.
#
# El plaintext de `username` es literalmente el nombre del role: CNPG lo compara, y si
# no cuadra ignora la contrasena sin avisar.
roleSecrets:
  deal-tracker-prod-db:
    username: ""
    password: ""
