# Keycloak PostgreSQL - entorno de PRODUCCION (issue #62)
# Namespace: data-prod
# Deployment: k3s local con almacenamiento Longhorn
# Cluster CNPG separado de platform-postgres: aqui solo vive el IdP de produccion.

cluster:
  fullnameOverride: keycloak-postgres-prod

  cluster:
    imageName: ghcr.io/cloudnative-pg/postgresql:16.4

    # Una sola instancia, a proposito.
    # Subir a 2 dejaria el segundo pod en Pending: la nodeAffinity de mas abajo exige
    # worker AND performance=high y `worker4` es el unico worker con esa etiqueta. Ver
    # la nota larga en apps/data/cnpg/environments/local/dev.yaml.
    # La recuperacion de este cluster es por backup, no por failover.
    instances: 1

    # `keycloak_dev` ocupa 15MB tras un ano; 10Gi es holgado de sobra para el esquema
    # de un Keycloak, que no crece con los datos de la aplicacion.
    storage:
      size: 10Gi
      storageClass: longhorn
    walStorage:
      storageClass: longhorn
      size: 1Gi

    # Un Keycloak con dos usuarios no necesita mas que esto. El limite deja margen
    # para el import inicial del realm, que es el pico.
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"

    # Node affinity: solo workers de alto rendimiento.
    # Las dos expresiones van ANDed, asi que la instancia cae en un nodo que es worker
    # AND performance=high (el control-plane master1 tambien lleva performance=high,
    # por eso la etiqueta de worker es obligatoria para excluirlo).
    affinity:
      enablePodAntiAffinity: true
      topologyKey: kubernetes.io/hostname
      podAntiAffinityType: preferred
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/worker
                  operator: In
                  values:
                    - "true"
                - key: node.kubernetes.io/performance
                  operator: In
                  values:
                    - high

    additionalLabels:
      app.kubernetes.io/part-of: data-platform
      app.kubernetes.io/component: keycloak-db
      environment: prod
      deployment: local

    # OJO CON LA RUTA: es `cluster.cluster.initdb`, NO `cluster.cluster.bootstrap.initdb`.
    # El subchart arma el bloque `bootstrap:` el solo a partir de `initdb`, asi que un
    # `bootstrap:` escrito a mano aqui NO SE LEE — Helm lo acepta, el render sale con los
    # valores de otro sitio y no avisa nadie. Comprobado: forzando
    # `cluster.cluster.bootstrap.initdb.database=ZZZ` el Cluster renderiza igual, y
    # forzando `cluster.cluster.initdb.database=ZZZ` cambia.
    # (apps/data/authentik-postgres/environments/local/casa.yaml lleva ese bloque muerto.)
    initdb:
      database: keycloak_prod
      owner: keycloak_prod
      secret:
        name: keycloak-postgres-app

      # SIN ESTO KEYCLOAK NO ARRANCA. Su ConfigMap fija `KC_DB_SCHEMA: keycloak`, y
      # Keycloak espera encontrar ese schema: no lo crea. Liquibase muere con
      # `ERROR: schema "keycloak" does not exist` al intentar crear `databasechangelog`,
      # y el pod entra en bucle de reinicio.
      #
      # En `keycloak_dev` ese schema lo creo alguien A MANO en su dia —es de los objetos
      # que no viven en ningun repo, el mismo agujero de la #56—. Aqui se declara, asi que
      # reconstruir esta base desde cero reproduce una que arranca.
      #
      # postInitApplicationSQL corre UNA VEZ, en el bootstrap y contra la base de la
      # aplicacion. Anadirlo a un cluster ya arrancado no lo ejecuta: si hiciera falta
      # cambiarlo, hay que recrear el cluster.
      postInitApplicationSQL:
        - CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION keycloak_prod

    primaryUpdateStrategy: unsupervised

    # Tuning para una instancia pequena: el unico inquilino es Keycloak.
    postgresql:
      parameters:
        max_connections: "100"
        shared_buffers: "128MB"
        effective_cache_size: "512MB"
        maintenance_work_mem: "32MB"
        work_mem: "1310kB"
        checkpoint_completion_target: "0.9"
        wal_buffers: "16MB"
        default_statistics_target: "100"
        random_page_cost: "1.1"
        effective_io_concurrency: "200"
        min_wal_size: "128MB"
        max_wal_size: "512MB"

  # Backup logico a MinIO. Forma completa en el values.yaml base.
  # Va atado a `backupSecret` de mas abajo: los dos flags se encienden a la vez y en el
  # MISMO COMMIT que los ciphertexts. Con `backups.enabled` y sin Secret, el archivado
  # de WAL falla y el cluster arranca igual — el fallo no se ve hasta el dia que hace
  # falta el backup.
  backups:
    enabled: true

# Credenciales del role `keycloak_prod`. El mismo plaintext del password esta sellado
# tambien contra `security-prod` en apps/security/keycloak/environments/local/prod.yaml
# (KC_DB_PASSWORD): dos ciphertexts distintos del mismo secreto, porque el sellado va
# atado a namespace + nombre. Si se rota, se rotan los dos en el mismo commit.
sealedSecret:
  enabled: true
  name: keycloak-postgres-app
  encryptedData:
    username: ""
    password: ""

# Credencial S3 del backup a MinIO: usuario `cnpg-backup`, compartido con
# platform-postgres-dev y authentik-postgres-casa. Los tres clusters escriben en el
# mismo bucket sin pisarse porque CNPG cuelga cada uno de su propio serverName
# (s3://cnpg-backup/keycloak-postgres-prod/...).
#
# Es el MISMO plaintext que en los otros dos values, pero el ciphertext es distinto y
# NO son intercambiables: un SealedSecret va atado a namespace + nombre.
#
# NO SE SELLA A MANO DESDE EL SECRET VIVO. El bucket, la policy, el usuario y el
# plaintext los gobierna juanjocop/kxs-ansible (`roles/minio_creds`,
# `playbooks/minio_creds.yml`, vault cifrado); `data-prod` es un destino mas de su
# `minio_seal_targets` desde kxs-ansible#57, y estos dos valores salen tal cual de su
# `out/cnpg-backup-s3-creds.yaml`. Para ROTARLA se vuelve a ejecutar aquel playbook y
# se re-pegan LOS TRES ficheros. Crear credenciales de MinIO por fuera de ese camino
# es exactamente como `longhorn-backup` costo 49 dias de backup roto en silencio.
backupSecret:
  enabled: true
  name: cnpg-backup-s3-creds
  encryptedData:
    accessKeyId: ""
    secretAccessKey: ""
